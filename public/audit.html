<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;font:13px monospace;background:#0d0d0d;color:#9f9;padding:16px}
#log{font-size:15px;margin-bottom:8px}
table{border-collapse:collapse;width:100%%}
td,th{border:1px solid #333;padding:3px 7px;text-align:left;font-size:11px}
.bad{color:#f66}.warn{color:#fa3}
</style></head><body>
<div id="log">init…</div><pre id="json" style="display:none"></pre>
<div id="out"></div>
<iframe id="f" style="width:900px;height:620px;border:0"></iframe>
<script>
const IDS = ["modern-css-reset", "attribute-selectors", "pseudo-class-ui-states", "css-custom-properties", "cascade-layers", "css-nesting", "container-queries", "container-query-units", "has-relational-selector", "property-at-rule", "style-queries", "css-grid-auto-placement", "subgrid", "css-masonry", "anchor-positioning", "scroll-driven-animations-css", "view-transitions-css", "houdini-paint-worklet", "logical-properties", "min-max-clamp-sizing", "is-where-selectors", "text-wrap-balance", "scope-at-rule", "over-scroll-behavior", "flexbox-centering", "flex-wrap-toolbar", "grid-twelve-column", "grid-template-areas", "grid-auto-fit-cards", "sticky-sidebar-split", "sticky-section-stacking", "split-screen-panel", "bento-grid", "full-bleed-breakout", "magazine-multicol", "overlapping-layout", "intrinsic-ratio-media", "app-shell-layout", "css-columns-masonry-hybrid", "centering-abs-inset", "fluid-type-clamp", "modular-type-scale", "variable-fonts", "font-optical-sizing", "font-feature-settings", "drop-cap-initial-letter", "kinetic-typography", "split-text-reveal", "vertical-writing-modes", "mixed-script-typography", "gradient-text-clip", "variable-font-animation", "text-box-trim", "hyphenation-justification", "oklch-color", "color-mix", "relative-color-syntax", "light-dark-function", "linear-gradient", "conic-gradient", "radial-gradient", "mesh-gradients", "blend-modes", "duotone-images", "grain-noise-texture", "css-filters", "masks", "clip-paths", "gradient-borders", "image-art-direction", "forced-colors-adaptation", "css-keyframes", "easing-curves", "transitions-vs-animations", "individual-transform-properties", "spring-physics-motion", "flip-technique", "stagger-orchestration", "scroll-triggered-reveals", "parallax-layering", "hover-micro-interactions", "3d-card-tilt", "morphing-blobs-shapes", "page-transitions", "shared-element-transition-js", "smooth-scroll-inertia", "scroll-scrubbing", "motion-choreography-system", "marquee-loop", "count-up-number-animations", "text-scramble-decode", "drag-to-reorder", "file-drag-drop-zone", "virtualized-lists", "optimistic-ui", "command-palette", "undo-redo-pattern", "keyboard-navigation", "focus-management", "touch-gestures", "pull-to-refresh", "infinite-scroll-pagination", "multi-select-bulk-actions", "inline-edit-in-place", "three-scene-setup", "gltf-model-loading", "custom-shaders-glsl", "noise-displacement", "raymarching", "gpu-particles-instancing", "post-processing", "fluid-simulation", "webgpu-compute", "product-viewer-3d", "scrollytelling-3d", "environment-reflections", "physics-in-3d", "react-three-fiber", "css-3d-transforms", "canvas-2d-fundamentals", "canvas-particle-systems", "generative-art-systems", "perlin-flow-fields", "fractal-trees-lsystems", "noise-terrain-visualization", "svg-path-animation", "svg-filters", "data-driven-svg-d3", "lottie-animations", "canvas-pixel-manipulation", "canvas-scene-graph", "pixi-webgl-2d", "voronoi-delaunay-generative", "web-audio-graph", "audio-reactive-visuals", "waveform-rendering", "video-scrubbing-frame", "canvas-video-compositing", "webgl-video-textures", "picture-in-picture-document", "speech-synthesis-recognition", "media-session-metadata", "screen-capture-recording", "bar-line-charts", "interactive-tooltips-crosshair", "animated-chart-transitions", "hierarchical-visualizations", "network-graphs", "sankey-flow-diagrams", "geo-interactive-maps", "d3-scales-axes-mastery", "realtime-data-streams", "gantt-timelines", "data-viz-accessibility", "word-clouds-semantic-zoom", "transformersjs-inference", "webgpu-inference", "face-landmark-detection", "pose-detection", "background-removal", "object-detection-overlay", "streaming-llm-ui", "streaming-markdown-render", "semantic-search-embeddings", "ai-image-generation-canvas", "smart-text-magic-wand", "view-transitions-api-cross-doc", "popover-api", "native-dialog-element", "details-accordion", "custom-elements", "shadow-dom-encapsulation", "pwa-offline-first", "service-worker-strategies", "web-transport-streams", "webhid-serial-bluetooth", "gamepad-api", "webxr-immersive", "shared-workers-broadcast", "opfs-local-first", "crdt-collaboration", "edge-rendering-streams", "islands-partial-hydration", "web-midi-haptics-nfc", "file-system-access", "web-clipboard-sharing", "signals-reactivity", "vdom-mastery", "code-splitting", "prefetch-strategies", "image-optimization-pipeline", "font-loading-strategy", "critical-css-inlining", "streaming-ssr-rsc", "bfcache-mastery", "web-workers-offloading", "compositor-only-animations", "content-visibility", "performance-profiling-workflow", "micro-frontends-module-federation", "state-management-patterns", "url-state-deep-linking", "semantic-landmarks", "aria-patterns", "skip-links-focus-order", "reduced-motion-respect", "prefers-contrast-transparency", "color-contrast-auditing", "rtl-layout-mirroring", "internationalization-locale", "form-accessibility", "live-regions-announcements", "zoom-responsive-a11y", "audit-automation-a11y", "debug-outlines", "devtools-overlays-mastery", "design-tokens-system", "theme-switching-strategies", "dark-mode-strategies", "custom-scrollbar-styling", "selection-focus-styling", "console-driven-debugging", "feature-detection-graceful", "css-print-stylesheet", "error-boundary-empty-states", "localstorage-persistence-patterns"];
const sp = new URLSearchParams(location.search);
const start = +(sp.get('start') || 0), limit = +(sp.get('limit') || 60);
const slice = IDS.slice(start, start + limit);
const log = document.getElementById('log'), out = document.getElementById('out'), f = document.getElementById('f');
const results = {};
let i = 0, running = false;

function render() {
  const rows = Object.entries(results).map(([id, r]) => {
    const cls = r.errs.length ? 'bad' : (r.elems < 4 ? 'warn' : 'ok');
    const msg = r.errs.length ? r.errs.join(' | ').replace(/</g,'&lt;') : (r.elems < 4 ? 'elems=' + r.elems + ' text=' + r.text : 'ok');
    return '<tr><td>' + id + '</td><td class="' + cls + '">' + msg + '</td></tr>';
  }).join('');
  out.innerHTML = '<h2>' + Object.keys(results).length + '/' + slice.length + ' audited (start=' + start + ')</h2><table>' + rows + '</table>';
  document.getElementById('json').textContent = JSON.stringify(results);
  document.title = 'AUDIT ' + start + ':' + Object.keys(results).length;
}

function loadNext() {
  if (i >= slice.length) { log.textContent = 'DONE chunk ' + start; render(); return; }
  log.textContent = ' auditing #' + (start + i + 1) + ' — ' + slice[i];
  f.src = '/techniques-demos/' + slice[i] + '.html';
}

f.addEventListener('load', () => {
  if (!running) return;
  const id = slice[i];
  try {
    const w = f.contentWindow, d = f.contentDocument;
    const errs = (w.__errors || []).filter(m => !/favicon|ResizeObserver|net::|Failed to load|media/i.test(m));
    results[id] = { text: d.body ? d.body.innerText.trim().length : 0, elems: d.body ? d.body.querySelectorAll('*').length : 0, errs: errs.slice(0,3) };
  } catch(e) { results[id] = { text: -1, elems: -1, errs: ['frame: ' + e.message] }; }
  i++;
  setTimeout(loadNext, 220);
});

window.__captureErrors = () => {
  try {
    const w = f.contentWindow;
    w.__errors = [];
    w.addEventListener('error', e => (w.__errors = w.__errors || []).push(String(e.message)));
    w.addEventListener('unhandledrejection', e => (w.__errors = w.__errors || []).push('promise: ' + String(e.reason)));
  } catch(e) {}
};
f.addEventListener('load', () => setTimeout(window.__captureErrors, 60));

render();
running = true;
loadNext();
</script></body></html>
