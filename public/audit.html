const f = document.getElementById('f');
const log = document.getElementById('log');

function loadNext() {
  if (i >= IDS.length) {
    window.__AUDIT_DONE__ = JSON.stringify(out);
    log.textContent = 'DONE ' + Object.keys(out).length;
    return;
  }
  const id = IDS[i];
  f.src = '/techniques-demos/' + id + '.html';
}

f.addEventListener('load', () => {
  const id = IDS[i];
  try {
    const d = f.contentDocument;
    const errs = d.__errors || [];
    const text = d.body ? d.body.innerText.trim().length : 0;
    const elems = d.body ? d.body.querySelectorAll('*').length : 0;
    out[id] = {text, elems, errs: errs.slice(0,3)};
  } catch(e) {
    out[id] = {text: -1, elems: -1, errs: ['frame-access: ' + e.message]};
  }
  i++;
  setTimeout(loadNext, 350);
});

// inject error capture into frames via same-origin injection on load start
f.addEventListener('load', () => {
  try {
    const w = f.contentWindow, d = f.contentDocument;
    w.__errors = w.__errors || [];
    w.addEventListener('error', e => (w.__errors = w.__errors || []).push(e.message));
  } catch(e){}
});
