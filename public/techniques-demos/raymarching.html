<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raymarching SDF</title><style>:root{color-scheme:dark}body{background:#0d0d0d;color:#e4e4e4;font:14px/1.5 system-ui,sans-serif;margin:0;min-height:100vh}

body{margin:0;overflow:hidden}
#hud{position:fixed;bottom:14px;left:14px;color:#666;font:12px monospace}

</style></head><body>

<div id=hud>fragment-shader raymarch · morphing sphere↔torus · move mouse</div>
<script type="module">

import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
const camera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);
const frag=`
precision highp float;
uniform float uTime;uniform vec2 uRes;uniform vec2 uMouse;
varying vec2 vUv;
float sdSphere(vec3 p,float r){return length(p)-r;}
float sdTorus(vec3 p,vec2 t){vec2 q=vec2(length(p.xz)-t.x,p.y);return length(q)-t.y;}
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
mat2 rot(float a){float s=sin(a),c=cos(a);return mat2(c,-s,s,c);}
float map(vec3 p){
  p.xz*=rot(uTime*.3);
  p.yz*=rot(uTime*.17);
  float morph=.5+.5*sin(uTime*.5);
  float s=sdSphere(p,1.);
  float t=sdTorus(p,vec2(1.,.42));
  return smin(s,t,.6*morph+.15);
}
float shadow(vec3 ro,vec3 rd){
  float res=1.,t=.02;
  for(int i=0;i<24;i++){
    float h=map(ro+rd*t);
    res=min(res,10.*h/t);
    t+=clamp(h,.02,.3);
    if(res<.005||t>6.)break;
  }
  return clamp(res,0.,1.);
}
void main(){
  vec2 uv=(vUv-.5)*vec2(uRes.x/uRes.y,1.);
  vec3 ro=vec3(0,0,uMouse.y*2.-1.5);
  ro.xz*=rot(uMouse.x*3.);
  vec3 rd=normalize(vec3(uv,-1.5));
  float t=0.;float glow=0.;
  bool hit=false;
  for(int i=0;i<80;i++){
    vec3 p=ro+rd*t;
    float d=map(p);
    glow+=.015/(1.+d*d*40.);
    if(d<.001){hit=true;break;}
    t+=d;if(t>8.)break;
  }
  vec3 col=vec3(.02,.03,.05)+vec3(.2,.7,.9)*glow;
  if(hit){
    vec3 p=ro+rd*t;
    vec2 e=vec2(.001,0);
    vec3 n=normalize(vec3(map(p+e.xyy)-map(p-e.xyy),map(p+e.yxy)-map(p-e.yxy),map(p+e.yyx)-map(p-e.yyx)));
    vec3 l=normalize(vec3(1.,2.,1.));
    float dif=max(dot(n,l),0.);
    float sh=shadow(p+n*.02,l);
    float fog=1.-exp(-.08*t*t);
    col=mix(vec3(.3,.75,.65)*(dif*sh)+vec3(.1),col,fog);
  }
  col=pow(col,vec3(.4545));
  gl_FragColor=vec4(col,1.);
}`;
const vert=`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.);}`;
const uniforms={uTime:{value:0},uRes:{value:new THREE.Vector2(innerWidth,innerHeight)},uMouse:{value:new THREE.Vector2(0,.3)}};
const mesh=new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShaderMaterial({vertexShader:vert,fragmentShader:frag,uniforms}));
const scene=new THREE.Scene();scene.add(mesh);
addEventListener('mousemove',e=>{uniforms.uMouse.value.set(e.clientX/innerWidth-.5,e.clientY/innerHeight-.5);});
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);uniforms.uRes.value.set(innerWidth,innerHeight);});
(function loop(t){requestAnimationFrame(loop);uniforms.uTime.value=t*.001;renderer.render(scene,camera);})(0);
</script></body></html>
