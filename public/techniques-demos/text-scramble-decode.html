<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Scramble Decode</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0d0d0d; color:#e4e4e4; font-family:'Helvetica Neue', Arial, sans-serif; min-height:100vh; }

.term { max-width:640px; margin:0 auto; padding:12vh 4vw; font-family:'SF Mono', ui-monospace, Menlo, monospace; }
.bar { display:flex; align-items:center; gap:0.5rem; margin-bottom:2rem; }
.dot { width:11px; height:11px; border-radius:50%; }
.r { background:#e86a6a; } .y { background:#eec07e; } .g { background:#7ee8a8; }
.title { margin-left:0.8rem; font-size:0.78rem; color:#666; }
h1 { font-size:clamp(1.4rem,4vw,2.4rem); font-weight:500; color:#7ee8a8; min-height:2.4em; margin-bottom:2rem; white-space:pre-wrap; }
.chans { display:flex; gap:0.6rem; flex-wrap:wrap; }
.chans button { background:none; border:1px solid #2e3e2e; color:#7ee8a8; padding:0.5rem 1rem; font-family:inherit; font-size:0.78rem; cursor:pointer; border-radius:4px; }
.chans button:hover { background:rgba(126,232,168,0.08); }
.hint { margin-top:2rem; color:#4a5a4a; font-size:0.8rem; }

</style>
</head>
<body>

<div class="term">
  <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="title">transmission://channel-07</span></div>
  <h1 id="out">&gt; awaiting signal</h1>
  <div class="chans" id="chans"></div>
  <p class="hint">Select a transmission — characters cycle random glyphs, then lock in left to right.</p>
</div>

<script>

const GLYPHS = '!<>-_\\/[]{}—=+*^?#01';
const MSGS = ['SIGNAL ACQUIRED', 'THE MESH IS AWAKE', 'DECRYPTING PAYLOAD', 'HOLD THE LINE'];
const chans = document.getElementById('chans'), out = document.getElementById('out');
MSGS.forEach(function(m, i) {
  const b = document.createElement('button');
  b.textContent = 'TX-' + (i + 1);
  b.addEventListener('click', function() { scramble(m); });
  chans.appendChild(b);
});
let raf = null;
function scramble(text) {
  if (raf) cancelAnimationFrame(raf);
  const from = out.textContent;
  const len = Math.max(from.length, text.length);
  const t0 = performance.now();
  function frame(now) {
    const t = (now - t0) / 1200;
    let s = '';
    for (let i = 0; i < len; i++) {
      const lockAt = (i / len) * 0.75;
      if (t >= lockAt + 0.15 && i < text.length) s += text[i];
      else if (i >= text.length && t > 0.9) s += '';
      else s += text[i] !== ' ' ? GLYPHS[Math.floor(Math.random() * GLYPHS.length)] : ' ';
    }
    out.textContent = '> ' + s;
    if (t < 1) raf = requestAnimationFrame(frame);
    else { out.textContent = '> ' + text; raf = null; }
  }
  raf = requestAnimationFrame(frame);
}
setTimeout(function() { scramble(MSGS[0]); }, 400);

</script>
</body>
</html>
