<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>URL as State — Deep Linking</title>
<style>
body{margin:0;background:#0d0d0d;color:#e4e4e4;font:15px system-ui;padding:24px}
h1{font-size:18px} p{color:#888}
.bar{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0;padding:14px;background:#161616;border-radius:8px;border:1px solid #2a2a2a}
label{font-size:13px;display:flex;gap:6px;align-items:center;cursor:pointer}
#url{margin:10px 0;font:13px ui-monospace,monospace;color:#9effa1;background:#111;border:1px solid #2a2a2a;padding:10px;border-radius:6px;word-break:break-all}
.copy{background:#242424;color:#e4e4e4;border:1px solid #3a3a3a;padding:7px 14px;border-radius:6px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}
.card{border:1px solid #2a2a2a;border-radius:10px;padding:14px;background:#161616}
.tag{font:10px monospace;padding:2px 8px;border-radius:99px}
.js{background:#3a3a1a;color:#fb5}.py{background:#1a2a3a;color:#6cf}.rs{background:#3a1a2a;color:#f6a}
.hidden{opacity:.15}
#pop{margin-top:8px;color:#888;font:12px monospace;min-height:18px}
</style></head><body>
<h1>Catalog where every filter is in the URL</h1>
<p>Toggle filters, copy the URL, paste it in a new tab — the exact view is reproduced. Use the browser back button to undo filters.</p>
<div class="bar">
<label><input type="checkbox" data-f="js"> JavaScript</label>
<label><input type="checkbox" data-f="py"> Python</label>
<label><input type="checkbox" data-f="rs"> Rust</label>
<label><input type="checkbox" data-f="sale"> On sale only</label>
</div>
<div id="url"></div><button class="copy" onclick="copyUrl()">📋 Copy link</button>
<span id="copied" style="color:#9e9;font-size:12px"></span>
<div id="pop"></div>
<div class="grid" id="grid"></div>
<script>
const items=[
 ['Web scraper bot','js'],['Data pipeline','py'],['CLI tool','rs'],['API server','js'],
 ['ML trainer','py'],['WASM game','rs'],['Browser ext','js'],['Notebook kit','py']];
const sale=new Set([1,3,6]);
const grid=document.getElementById('grid');
items.forEach((it,i)=>{ const c=document.createElement('div'); c.className='card';
  c.innerHTML=`<b>${it[0]}</b><br><span class="tag ${it[1]}">${it[1]}</span> ${sale.has(i)?'<span class="tag" style="background:#3a2a1a;color:#fb5">sale</span>':''}`;
  c.dataset.tags=it[1]+(sale.has(i)?' sale':''); grid.append(c); });
function readState(){
  const u=new URL(location);
  return { tags:u.searchParams.getAll('tag'), sale:u.searchParams.has('sale') };
}
function apply(){
  const s=readState();
  let visible=0;
  document.querySelectorAll('.card').forEach(c=>{
    const tags=c.dataset.tags.split(' ');
    const tagOk = s.tags.length===0 || s.tags.every(t=>tags.includes(t));
    const saleOk = !s.sale || tags.includes('sale');
    const show=tagOk&&saleOk; c.classList.toggle('hidden',!show); if(show)visible++;
  });
  document.getElementById('url').textContent = location.href;
  document.getElementById('pop').textContent='';
}
function writeState(){
  const u=new URL(location);
  u.searchParams.delete('tag');
  document.querySelectorAll('input[data-f]').forEach(cb=>{
    if(cb.dataset.f==='sale'){ if(cb.checked) u.searchParams.set('sale','1'); else u.searchParams.delete('sale'); }
    else if(cb.checked) u.searchParams.append('tag',cb.dataset.f);
  });
  history.pushState({}, '', u);
  apply();
}
window.onpopstate = e=>{ syncBoxes(); apply(); document.getElementById('pop').textContent='↩ popstate — restored from history'; };
function syncBoxes(){ const s=readState();
  document.querySelectorAll('input[data-f]').forEach(cb=>{ cb.checked = cb.dataset.f==='sale' ? s.sale : s.tags.includes(cb.dataset.f); }); }
document.querySelectorAll('input[data-f]').forEach(cb=>cb.onchange=writeState);
function copyUrl(){ navigator.clipboard?.writeText(location.href);
  document.getElementById('copied').textContent=' ✓ copied — open in a new tab'; setTimeout(()=>document.getElementById('copied').textContent='',2500); }
syncBoxes(); apply();
</script></body></html>
