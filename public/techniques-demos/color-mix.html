<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>color-mix() Blending</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0d0d0d; color:#e4e4e4; font-family:'Helvetica Neue', Arial, sans-serif; min-height:100vh; }

:root { --brand:#e8b96a; --ink:#101418; }
.wrap { max-width:640px; margin:0 auto; padding:8vh 5vw; text-align:center; }
h1 { font-size:1.7rem; margin-bottom:2.5rem; font-weight:700; }
.mixer { display:flex; align-items:center; justify-content:center; gap:1rem; margin-bottom:1.5rem; }
.slot { width:110px; height:110px; border-radius:14px; border:1px solid #333; }
.result { box-shadow:0 0 30px rgba(232,185,106,0.25); }
.op { color:#666; font-size:0.9rem; }
.formula { font-family:ui-monospace, monospace; font-size:0.85rem; color:#8ab4ff; margin-bottom:2.5rem; min-height:1.2em; }
#btn { background:var(--brand); color:#101014; border:none; padding:1rem 2rem; font-size:1rem; border-radius:10px; cursor:pointer; font-weight:600;
  transition:background 0.35s; }
#btn:hover, #btn:focus-visible { background:color-mix(in oklab, var(--brand), black 35%); }
.hint { color:#777; font-size:0.85rem; margin-top:1.5rem; line-height:1.6; }

</style>
</head>
<body>

<div class="wrap">
  <h1>color-mix() Lab</h1>
  <div class="mixer">
    <div class="slot" id="s1"></div>
    <div class="op">in oklab</div>
    <div class="slot" id="s2"></div>
    <div class="op">=</div>
    <div class="slot result" id="res"></div>
  </div>
  <p id="formula" class="formula"></p>
  <button id="btn">Hover or focus me — I mix toward black in OKLCH</button>
  <p class="hint">The button's hover state is color-mix(in oklab, var(--brand), black 35%) — derived, not hand-picked.</p>
</div>

<script>

const s1 = document.getElementById('s1'), s2 = document.getElementById('s2'), res = document.getElementById('res');
s1.style.background = 'var(--brand)';
s2.style.background = 'black';
res.style.background = 'color-mix(in oklab, var(--brand), black 35%)';
document.getElementById('formula').textContent = 'color-mix(in oklab, #e8b96a, black 35%)';
if (!CSS.supports('background', 'color-mix(in oklab, red, black)')) {
  document.querySelector('.hint').textContent = 'Fallback text: color-mix unsupported - hover mix disabled.';
}

</script>
</body>
</html>
