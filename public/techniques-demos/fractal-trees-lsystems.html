<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fractal Trees</title><style>:root{color-scheme:dark}body{background:#0d0d0d;color:#e4e4e4;font:14px/1.5 system-ui,sans-serif;margin:0;min-height:100vh}

body{margin:0;overflow:hidden}
#ui{position:fixed;top:14px;left:14px;background:rgba(22,22,22,.85);border:1px solid #333;border-radius:10px;padding:12px;font-size:12px;width:200px;z-index:5}
#ui label{display:flex;justify-content:space-between;margin:6px 0;color:#888}
#ui input{accent-color:#7ee787;width:105px}
#ui b{color:#7ee787}

</style></head><body>

<div id=ui><label>angle <input id=a type=range min=5 max=45 value=22><b id=av>22°</b></label>
<label>decay <input id=d type=range min=0.55 max=0.85 step=.01 value=.72><b id=dv>0.72</b></label>
<label>depth <input id=p type=range min=4 max=10 value=9><b id=pv>9</b></label>
<label>wind <input id=w type=range min=0 max=2 step=.1 value=.8><b id=wv>0.8</b></label></div>
<script>

const cv=document.createElement('canvas');document.body.appendChild(cv);
const ctx=cv.getContext('2d');
let W,H;function fit(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;
  cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}
fit();addEventListener('resize',fit);
let angle=22,decay=.72,depth=9,wind=.8,branches=0;
const A=document.getElementById('a'),AV=document.getElementById('av');
A.oninput=()=>{angle=+A.value;AV.textContent=angle+'°';};
const D=document.getElementById('d'),DV=document.getElementById('dv');
D.oninput=()=>{decay=+D.value;DV.textContent=decay.toFixed(2);};
const P=document.getElementById('p'),PV=document.getElementById('pv');
P.oninput=()=>{depth=+P.value;PV.textContent=depth;};
const Wd=document.getElementById('w'),WV=document.getElementById('wv');
Wd.oninput=()=>{wind=+Wd.value;WV.textContent=wind.toFixed(1);};
function branch(x,y,len,ang,level,t){
  if(level===0||len<2)return;
  branches++;
  const sway=Math.sin(t*2+level*1.3)*wind*.06*(depth-level)**1.5;
  const a2=ang+sway;
  const nx=x+Math.cos(a2)*len,ny=y+Math.sin(a2)*len;
  ctx.lineWidth=Math.max(.5,level*.9);
  ctx.strokeStyle=`hsl(${95+level*4},45%,${18+level*3}%)`;
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(nx,ny);ctx.stroke();
  const spread=angle*Math.PI/180;
  branch(nx,ny,len*decay,a2-spread,level-1,t);
  branch(nx,ny,len*decay,a2+spread,level-1,t);
  if(level<=2){ // leaves
    ctx.fillStyle=`hsla(${330+Math.sin(level*7)*20},70%,70%,.65)`;
    ctx.beginPath();ctx.arc(nx,ny,2.2,0,Math.PI*2);ctx.fill();
  }
}
let last=performance.now(),fps=60;
(function loop(t){
  requestAnimationFrame(loop);
  const dt=(t-last)/1000;last=t;fps+=(1/Math.max(dt,.001)-fps)*.05;
  ctx.fillStyle='#0d0d0d';ctx.fillRect(0,0,innerWidth,innerHeight);
  branches=0;
  branch(innerWidth/2,innerHeight-20,Math.min(innerHeight*.16,110),-Math.PI/2,depth,t*.001);
  ctx.fillStyle='#555';ctx.font='11px monospace';
  ctx.fillText(`${branches} branches · ${fps|0} fps · depth ${depth}`,14,innerHeight-30);
})(performance.now());
</script></body></html>
