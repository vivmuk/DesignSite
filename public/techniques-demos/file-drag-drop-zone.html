<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>File Drag & Drop Zone</title><style>:root{color-scheme:dark}body{background:#0d0d0d;color:#e4e4e4;font:14px/1.5 system-ui,sans-serif;margin:0;min-height:100vh}

body{display:grid;place-items:center}
.wrap{width:min(640px,90vw);text-align:center}
#drop{border:2px dashed #444;border-radius:16px;padding:64px 24px;transition:.2s;cursor:pointer}
#drop.over{border-color:#7ee787;background:rgba(126,231,135,.08);transform:scale(1.02)}
#drop.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#thumbs{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px;justify-content:center}
#thumbs img{width:110px;height:110px;object-fit:cover;border-radius:8px;border:1px solid #333}
.status{margin-top:12px;color:#888;min-height:20px}

</style></head><body>

<div class="wrap">
<h1>Drop images here</h1>
<div id="drop" tabindex="0">Drag & drop image files (or click to browse)</div>
<input type="file" id="file" accept="image/*" multiple hidden>
<p class="status" id="status"></p>
<div id="thumbs"></div>
</div>
<script>

const drop=document.getElementById('drop'),status=document.getElementById('status'),thumbs=document.getElementById('thumbs'),file=document.getElementById('file');
drop.addEventListener('click',()=>file.click());
file.addEventListener('change',e=>handle([...e.target.files]));
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',e=>handle([...e.dataTransfer.files]));
function handle(files){
  const imgs=files.filter(f=>f.type.startsWith('image/'));
  const bad=files.length-imgs.length;
  if(bad){status.textContent=bad+' non-image file'+(bad>1?'s':'')+' rejected';drop.classList.add('shake');setTimeout(()=>drop.classList.remove('shake'),450);}
  else status.textContent='';
  imgs.forEach(f=>{
    const url=URL.createObjectURL(f),img=new Image();
    img.src=url;img.alt=f.name;img.title=f.name+' ('+Math.round(f.size/1024)+' KB)';
    thumbs.prepend(img);
  });
}
</script></body></html>
