<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inline Edit-in-Place</title><style>:root{color-scheme:dark}body{background:#0d0d0d;color:#e4e4e4;font:14px/1.5 system-ui,sans-serif;margin:0;min-height:100vh}

.wrap{max-width:440px;margin:48px auto}
.card{background:#161616;border:1px solid #333;border-radius:14px;padding:28px}
.field{margin-bottom:20px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#777}
.value{padding:4px 0;border-bottom:1px dashed transparent;cursor:text;font-size:16px}
.value:hover{border-bottom-color:#444}
.value:focus{outline:none;border-bottom-color:#7ee787;background:#0d0d0d}
.dirty{color:#ffd866}
.saved{color:#7ee787;font-size:12px;height:16px;opacity:0;transition:.3s}
.saved.show{opacity:1}
.hint{color:#666;font-size:12px}

</style></head><body>

<div class="wrap">
<div class="card">
<h1 style="margin-top:0">Profile</h1>
<div class="field"><div class="label">Name</div><div class="value" contenteditable spellcheck=false>Viv Gates</div><div class="saved"></div></div>
<div class="field"><div class="label">Role</div><div class="value" contenteditable spellcheck=false>Design Engineer</div><div class="saved"></div></div>
<div class="field"><div class="label">Location</div><div class="value" contenteditable spellcheck=false>Lisbon, PT</div><div class="saved"></div></div>
<p class="hint">Click a field to edit · Enter saves · Escape cancels · blur autosaves</p>
</div>
</div>
<script>

document.querySelectorAll('.value').forEach(el=>{
  const saved=el.nextElementSibling;
  const original=el.textContent;
  el.addEventListener('focus',()=>{el._orig=el.textContent;el.classList.add('dirty');});
  el.addEventListener('input',()=>el.classList.add('dirty'));
  el.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();el.blur();}
    if(e.key==='Escape'){el.textContent=el._orig;el.blur();}
  });
  el.addEventListener('blur',()=>{
    const dirty=el.textContent!==el._orig;
    el.classList.remove('dirty');
    if(dirty){
      saved.textContent='✓ saved '+new Date().toLocaleTimeString();
      saved.classList.add('show');
      setTimeout(()=>saved.classList.remove('show'),1800);
      // fake persist
      localStorage.setItem('profile_'+el.previousElementSibling.textContent,el.textContent);
    }
  });
});
</script></body></html>
