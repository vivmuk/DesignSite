<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Infinite Scroll + Pagination</title><style>:root{color-scheme:dark}body{background:#0d0d0d;color:#e4e4e4;font:14px/1.5 system-ui,sans-serif;margin:0;min-height:100vh}

.wrap{max-width:520px;margin:24px auto}
#feed{min-height:50vh}
.row{padding:14px 18px;border:1px solid #262626;border-radius:10px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.row .av{width:36px;height:36px;border-radius:50%;background:#2a2a2a;flex:none}
.skel{height:64px;border-radius:10px;margin-bottom:10px;background:linear-gradient(100deg,#161616 40%,#222 50%,#161616 60%);background-size:200%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
#sentinel{height:1px}
#more{display:block;margin:12px auto;background:#1c1c1c;border:1px solid #333;color:#e4e4e4;border-radius:8px;padding:10px 18px;cursor:pointer}
.stats{position:sticky;top:0;background:#0d0d0d;padding:8px 0;color:#888;font-variant-numeric:tabular-nums}
.stats b{color:#7ee787}

</style></head><body>

<div class="wrap">
<h1>Infinite scroll with fallback</h1>
<div class="stats">items loaded: <b id="count">0</b> · batches: <b id="batches">0</b></div>
<div id="feed"></div>
<div id="skeletons"></div>
<div id="sentinel"></div>
<button id="more">Load more</button>
</div>
<script>

const feed=document.getElementById('feed'),skeletons=document.getElementById('skeletons'),more=document.getElementById('more');
let batch=0,loading=false,total=0;
function load(){
  if(loading)return;loading=true;more.style.visibility='hidden';
  for(let i=0;i<3;i++)skeletons.appendChild(Object.assign(document.createElement('div'),{className:'skel'}));
  setTimeout(()=>{ // fake network
    skeletons.innerHTML='';
    const b=++batch;
    for(let i=0;i<8;i++){
      total++;
      const d=document.createElement('div');d.className='row';
      d.innerHTML=`<div class="av"></div><div><b>User ${total}</b><br>batch ${b} · item ${i+1}/8</div>`;
      feed.appendChild(d);
    }
    document.getElementById('count').textContent=total;
    document.getElementById('batches').textContent=b;
    loading=false;more.style.visibility='visible';
  },700);
}
new IntersectionObserver(es=>{if(es[0].isIntersecting)load();},{rootMargin:'400px'}).observe(document.getElementById('sentinel'));
more.addEventListener('click',load);
load();
</script></body></html>
