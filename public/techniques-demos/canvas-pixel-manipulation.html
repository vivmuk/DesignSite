<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Manipulation</title><style>:root{color-scheme:dark}body{background:#0d0d0d;color:#e4e4e4;font:14px/1.5 system-ui,sans-serif;margin:0;min-height:100vh}

body{margin:0;font-family:system-ui,sans-serif;background:#0d0d0d;color:#e4e4e4;display:grid;place-items:center;min-height:100vh}
.wrap{display:grid;gap:16px;justify-items:center}
canvas{image-rendering:pixelated;border:1px solid #333;border-radius:8px}
#bar{display:flex;gap:14px;align-items:center;font-size:13px;color:#888}
button{background:#1c1c1c;border:1px solid #333;color:#e4e4e4;border-radius:6px;padding:6px 14px;cursor:pointer}
button.on{border-color:#7ee787;color:#7ee787}
input{accent-color:#7ee787}
#ms{font:11px monospace;color:#7ee787}

</style></head><body>

<div class=wrap>
<canvas id=out width=480 height=360></canvas>
<div id=bar><button data-m=ascii class=on>ascii</button><button data-m=bayer>bayer</button><button data-m=orig>original</button>
<label>cell <input id=cell type=range min=4 max=16 value=6></label><span id=ms></span></div>
<input type=file id=file accept="image/*" style="color:#888">
<p style="color:#666;font-size:12px">pick an image, or use the built-in generated demo image</p>
</div>
<script>

const out=document.getElementById('out'),octx=out.getContext('2d');
let mode='ascii',cell=6,img=null;
// procedural demo image
function makeDemoImage(){
  const c=document.createElement('canvas');c.width=480;c.height=360;
  const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,480,360);
  g.addColorStop(0,'#0a1a3a');g.addColorStop(.5,'#7a3a8a');g.addColorStop(1,'#ffb454');
  x.fillStyle=g;x.fillRect(0,0,480,360);
  x.fillStyle='rgba(255,255,255,.85)';
  x.beginPath();x.arc(360,90,55,0,Math.PI*2);x.fill();
  x.fillStyle='rgba(0,0,0,.7)';
  x.beginPath();x.moveTo(0,360);x.lineTo(150,140);x.lineTo(300,360);x.closePath();x.fill();
  x.beginPath();x.moveTo(180,360);x.lineTo(330,180);x.lineTo(480,360);x.closePath();x.fill();
  return c;
}
img=makeDemoImage();
const RAMP=' .:-=+*#%@';
const BAYER=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
function render(){
  const t0=performance.now();
  const cols=Math.floor(out.width/cell),rows=Math.floor(out.height/cell);
  // downsample
  const tmp=document.createElement('canvas');tmp.width=cols;tmp.height=rows;
  const tx=tmp.getContext('2d');
  tx.drawImage(img,0,0,cols,rows);
  const data=tx.getImageData(0,0,cols,rows).data;
  octx.fillStyle='#0d0d0d';octx.fillRect(0,0,out.width,out.height);
  octx.font=cell+'px monospace';octx.textBaseline='top';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const i=(r*cols+c)*4;
    const lum=(.2126*data[i]+.7152*data[i+1]+.0722*data[i+2])/255;
    if(mode==='ascii'){
      const ch=RAMP[Math.min(RAMP.length-1,Math.floor(lum*RAMP.length))];
      octx.fillStyle=`hsl(140,20%,${20+lum*65}%)`;
      octx.fillText(ch,c*cell,r*cell);
    } else if(mode==='bayer'){
      const th=(BAYER[r%4][c%4]+.5)/16;
      if(lum>th){octx.fillStyle='#e4e4e4';octx.fillRect(c*cell,r*cell,cell,cell);}
    } else {
      octx.fillStyle=`rgb(${data[i]},${data[i+1]},${data[i+2]})`;
      octx.fillRect(c*cell,r*cell,cell,cell);
    }
  }
  document.getElementById('ms').textContent=(performance.now()-t0).toFixed(1)+'ms · '+cols+'×'+rows+' cells';
}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;
  document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b));render();});
document.getElementById('cell').oninput=e=>{cell=+e.target.value;render();};
document.getElementById('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const url=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{img=im;render();URL.revokeObjectURL(url);};
  im.onerror=()=>alert('could not load image');
  im.src=url;
};
try{render();}catch(e){document.body.innerHTML='<p style="padding:40px;color:#ff6b81">✗ pixel access failed: '+e.message+' — showing fallback text</p>';}
</script></body></html>
