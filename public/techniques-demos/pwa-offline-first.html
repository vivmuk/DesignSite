<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PWA Notes — install &amp; offline</title>
<style>
  body{margin:0;background:#0d0d0d;color:#e4e4e4;font:15px/1.6 system-ui;padding:24px}
  h1{font-size:19px} .sub{color:#9a9a9a;font-size:13px}
  .board{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:760px}
  .card{background:#161616;border:1px solid #2a2a2a;border-radius:12px;padding:14px}
  .card h2{font-size:13px;margin:0 0 8px;color:#9a9a9a;text-transform:uppercase;letter-spacing:.05em}
  input,textarea{width:100%;box-sizing:border-box;background:#1a1a1a;color:#e4e4e4;border:1px solid #333;border-radius:8px;padding:9px;font:inherit;margin-bottom:8px}
  button{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
  #install{display:none;background:#34d399;color:#0d0d0d}
  li{font-size:13px;color:#b8b8b8;margin:6px 0;list-style:none;border-bottom:1px solid #222;padding-bottom:4px}
  .ok{color:#7ee787}.warn{color:#fbbf24}
  #net{font-size:12px;margin-top:8px}
</style>
</head>
<body>
<h1>Offline-first notes</h1>
<p class="sub">Served over HTTP(S)? A service worker caches the shell for offline use; the manifest makes it installable. Notes persist in localStorage even with zero network.</p>
<div class="board">
  <div class="card">
    <h2>New note</h2>
    <input id="title" placeholder="Title">
    <textarea id="body" placeholder="Body"></textarea>
    <button id="save">💾 Save note</button>
    <div id="net"></div>
  </div>
  <div class="card">
    <h2>Status dashboard</h2>
    <ul id="status"></ul>
    <button id="install">📲 Install app</button>
  </div>
</div>
<script>
const status = m => document.getElementById('status').insertAdjacentHTML('beforeend', `<li>${m}</li>`);
// manifest via data URL (keeps the demo single-file)
const manifest = {
  name:'Offline Notes', short_name:'Notes', start_url:'.', display:'standalone',
  background_color:'#0d0d0d', theme_color:'#0d0d0d',
  icons:[{src:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192"><rect width="192" height="192" fill="#2563eb"/><text x="96" y="120" font-size="90" text-anchor="middle" fill="#fff">N</text></svg>'), sizes:'192x192', type:'image/svg+xml'}]
};
const link = document.createElement('link'); link.rel='manifest';
link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));
document.head.append(link);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  const swCode = `
    const SHELL = ['${location.pathname.split('/').pop()||'index.html'}'];
    self.addEventListener('install', e => {
      e.waitUntil(caches.open('notes-v1').then(c => c.addAll(SHELL)).then(() => self.skipWaiting()));
    });
    self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
    self.addEventListener('fetch', e => {
      e.respondWith(
        caches.match(e.request).then(hit => hit || fetch(e.request).then(res => {
          const copy = res.clone();
          caches.open('notes-v1').then(c => c.put(e.request, copy));
          return res;
        }).catch(() => caches.match('/')))
      );
    });`;
  const url = URL.createObjectURL(new Blob([swCode], {type:'text/javascript'}));
  navigator.serviceWorker.register(url).then(() => status('<span class="ok">✓ Service worker registered — offline shell cached.</span>'))
    .catch(e => status('<span class="warn">SW registration failed: '+e.message+'</span>'));
}else{
  status('Service worker requires HTTPS (or localhost). Demo still works — data is in localStorage.');
}

let deferredPrompt = null;
addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e;
  document.getElementById('install').style.display = '';
  status('<span class="ok">✓ Install prompt available (installability criteria met).</span>');
});
document.getElementById('install').onclick = async () => {
  if (!deferredPrompt) return status('No install prompt available in this browser/session.');
  deferredPrompt.prompt();
  const {outcome} = await deferredPrompt.userChoice;
  status(`Install outcome: ${outcome}`);
  deferredPrompt = null;
};

const render = () => {
  document.getElementById('list').replaceChildren?.();
  status('Notes on disk: ' + JSON.parse(localStorage.getItem('notes')||'[]').length);
};
document.getElementById('save').onclick = () => {
  const notes = JSON.parse(localStorage.getItem('notes')||'[]');
  notes.push({t:document.getElementById('title').value||'Untitled', b:document.getElementById('body').value, at:Date.now()});
  localStorage.setItem('notes', JSON.stringify(notes));
  document.getElementById('title').value = document.getElementById('body').value = '';
  status('✓ Note saved locally — survives reload and offline.');
};
const net = () => document.getElementById('net').textContent =
  navigator.onLine ? '🌐 Online' : '📴 Offline — app keeps working';
addEventListener('online', net); addEventListener('offline', net); net();
render();
</script>
</html>
