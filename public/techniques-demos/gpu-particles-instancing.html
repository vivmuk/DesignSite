<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPU Particles</title><style>:root{color-scheme:dark}body{background:#0d0d0d;color:#e4e4e4;font:14px/1.5 system-ui,sans-serif;margin:0;min-height:100vh}

body{margin:0;overflow:hidden}
#ui{position:fixed;top:16px;left:16px;background:rgba(22,22,22,.85);border:1px solid #333;border-radius:10px;padding:12px;font-size:13px}
#ui button{display:block;margin:6px 0;background:#1c1c1c;border:1px solid #333;color:#e4e4e4;border-radius:6px;padding:6px 14px;cursor:pointer;width:130px}
#ui button:hover{border-color:#7ee787}
#count{color:#666;font-size:11px}

</style></head><body>

<div id=ui><h3 style="margin:0 0 6px">50,000 particles</h3>
<button data-s=sphere>Sphere</button><button data-s=heart>Heart</button><button data-s=galaxy>Galaxy</button>
<div id=count>50,000 instanced points</div></div>
<script type="module">

import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
const N=50000;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050505);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);camera.position.z=14;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
// targets
const targets={};
{ // sphere
  const a=new Float32Array(N*3);
  for(let i=0;i<N;i++){const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1),r=5*Math.cbrt(Math.random());
    a.set([r*Math.sin(ph)*Math.cos(th),r*Math.sin(ph)*Math.sin(th),r*Math.cos(ph)],i*3);}
  targets.sphere=a;
}
{ // heart (2D shape extruded)
  const a=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    let x,y;do{const t=Math.random()*Math.PI*2;x=16*Math.pow(Math.sin(t),3);y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);x*=Math.random();y*=Math.random();}while(false);
    a.set([x*.55,y*.55,(Math.random()-.5)*2],i*3);}
  targets.heart=a;
}
{ // galaxy
  const a=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const arm=i%3,r=(Math.random()**.6)*8,ang=arm*Math.PI*2/3+r*.9;
    a.set([r*Math.cos(ang)+(Math.random()-.5)*.8,(Math.random()-.5)*(1.5*Math.exp(-r*.3)),r*Math.sin(ang)+(Math.random()-.5)*.8],i*3);}
  targets.galaxy=a;
}
const geo=new THREE.BufferGeometry();
const pos=new Float32Array(N*3);pos.set(targets.galaxy);
const seed=new Float32Array(N);for(let i=0;i<N;i++)seed[i]=Math.random();
geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
geo.setAttribute('target',new THREE.BufferAttribute(targets.galaxy.slice(),3));
geo.setAttribute('aSeed',new THREE.BufferAttribute(seed,1));
const mat=new THREE.ShaderMaterial({
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  uniforms:{uTime:{value:0},uMix:{value:1}},
  vertexShader:`
attribute vec3 target;attribute float aSeed;
uniform float uTime,uMix;varying float vA;
void main(){
  float swirl=sin(uTime*.6+aSeed*40.)*.4;
  vec3 p=mix(position,target,uMix);
  p.x+=swirl;p.z+=cos(uTime*.5+aSeed*30.)*.4;
  vec4 mv=modelViewMatrix*vec4(p,1.);
  gl_PointSize=(1.5+aSeed*2.5)*(300./-mv.z);
  vA=.3+aSeed*.7;
  gl_Position=projectionMatrix*mv;
}`,
  fragmentShader:`
varying float vA;void main(){
  float d=length(gl_PointCoord-.5);if(d>.5)discard;
  gl_FragColor=vec4(mix(vec3(.3,.7,1.),vec3(.9,.4,.7),vA),vA*(1.-d*1.6));
}`});
scene.add(new THREE.Points(geo,mat));
// morph on demand
let cur='galaxy';
const uMix={v:1};
function morphTo(name){
  geo.attributes.target.array.set(targets[name]);
  geo.attributes.target.needsUpdate=true;
  uMix.v=0;cur=name;
  // ease uMix to 1
  const tick=()=>{uMix.v+=.03;if(uMix.v<1){mat.uniforms.uMix.value=uMix.v;requestAnimationFrame(tick);}else mat.uniforms.uMix.value=1;};
  tick();
}
document.querySelectorAll('#ui button').forEach(b=>b.onclick=()=>morphTo(b.dataset.s));
morphTo('galaxy');
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
(function loop(t){requestAnimationFrame(loop);mat.uniforms.uTime.value=t*.001;scene.rotation.y=t*.00008;renderer.render(scene,camera);})(0);
</script></body></html>
