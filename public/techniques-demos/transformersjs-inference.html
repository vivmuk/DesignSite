<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local Sentiment Analysis — transformers.js</title>
<style>
  body{margin:0;background:#0d0d0d;color:#e4e4e4;font:15px/1.6 system-ui;padding:24px}
  h1{font-size:19px} .sub{color:#9a9a9a;font-size:13px}
  textarea{width:100%;max-width:640px;box-sizing:border-box;background:#1a1a1a;color:#e4e4e4;border:1px solid #333;border-radius:10px;padding:12px;font:inherit;min-height:90px}
  button{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:8px 16px;font:inherit;cursor:pointer;margin-top:10px}
  button:disabled{opacity:.5;cursor:default}
  #meter{width:640px;max-width:100%;height:18px;background:#1a1a1a;border:1px solid #333;border-radius:9px;margin-top:14px;overflow:hidden}
  #fill{height:100%;width:0;background:linear-gradient(90deg,#f87171,#fbbf24,#34d399);transition:width .5s}
  #tokens{margin-top:12px;display:flex;gap:4px;flex-wrap:wrap;max-width:640px}
  .tok{background:#1f1f1f;border:1px solid #333;border-radius:6px;padding:2px 8px;font:12px monospace}
  .tok.pos{border-color:#34d399;color:#34d399}.tok.neg{border-color:#f87171;color:#f87171}
  #status{margin-top:10px;color:#9a9a9a;font-size:13px;min-height:40px}
</style>
</head>
<body>
<h1>Sentiment analysis, entirely in your browser</h1>
<p class="sub">A quantized transformer runs locally via ONNX (WASM/WebGPU). No server, no keys — first run downloads ~25 MB from the HF hub and caches it.</p>
<textarea id="input" placeholder="Type a product review…">Absolutely love this keyboard — the build quality is superb, though the software is a bit clunky.</textarea>
<div><button id="go">Analyze</button></div>
<div id="meter"><div id="fill"></div></div>
<div id="tokens"></div>
<div id="status">Model not loaded yet.</div>
<script>
let classifier = null;
async function ensureModel(){
  if (classifier) return classifier;
  if (!window.transformers){ throw new Error('transformers.js failed to load (offline?)'); }
  document.getElementById('status').textContent = 'Loading model (first run downloads ~25 MB)…';
  const { pipeline } = window.transformers;
  classifier = await pipeline('sentiment-analysis', 'Xenova/distilbert-base-uncased-finetuned-sst-2-english');
  return classifier;
}
document.getElementById('go').onclick = async () => {
  const text = document.getElementById('input').value.trim();
  if (!text) return;
  const btn = document.getElementById('go'); btn.disabled = true;
  const status = document.getElementById('status');
  try{
    const c = await ensureModel();
    status.textContent = 'Running inference…';
    const out = await c(text);
    const label = out[0].label, score = out[0].score;
    const positive = label.toUpperCase().includes('POS');
    document.getElementById('fill').style.width = (score*100).toFixed(0) + '%';
    status.innerHTML = `Sentiment: <b>${positive ? 'POSITIVE' : 'NEGATIVE'}</b> — confidence ${(score*100).toFixed(1)}%`;
    // token-ish highlight (word-level approximation around the classification)
    const toks = document.getElementById('tokens'); toks.innerHTML = '';
    text.split(/\s+/).forEach(w => {
      const s = document.createElement('span'); s.className = 'tok' + (w.length>3 ? (positive?' pos':' neg') : '');
      s.textContent = w; toks.append(s);
    });
  }catch(e){
    status.innerHTML = 'Inference unavailable: ' + e.message + '<br>Fallback: this demo needs the CDN to fetch the model once; everything after that runs offline.';
  }finally{ btn.disabled = false; }
};
</script>
<script type="module">
try{
  const mod = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2');
  window.transformers = mod;
  document.getElementById('status').textContent = 'Library loaded — click Analyze.';
}catch(e){
  document.getElementById('status').textContent = 'Could not load transformers.js — ' + e.message;
}
</script>
</html>
