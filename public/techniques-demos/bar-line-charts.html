<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Dashboard — Chart.js</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  body{margin:0;background:#0d0d0d;color:#e4e4e4;font:14px/1.5 system-ui;padding:24px}
  h1{font-size:19px} p.sub{color:#9a9a9a;font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;max-width:1100px}
  .card{background:#161616;border:1px solid #2a2a2a;border-radius:12px;padding:14px}
  .card h2{font-size:14px;margin:0 0 8px;color:#b8b8b8}
  button{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer;margin-bottom:12px}
  .active{color:#7ee787}
</style>
</head>
<body>
<h1>Product dashboard</h1>
<p class="sub">One dataset, three views. Click a bar to cross-filter every chart to that category — click "All" to reset.</p>
<button id="reset">⟲ All categories</button>
<div class="grid">
  <div class="card"><h2>Revenue by category</h2><canvas id="bar"></canvas></div>
  <div class="card"><h2>Margin trend</h2><canvas id="line"></canvas></div>
  <div class="card"><h2>Revenue share</h2><canvas id="donut"></canvas></div>
</div>
<script>
const DATA = {
  'Laptops':  { revenue: 420, trend: [3.1, 4.2, 3.8, 5.0, 4.6] },
  'Phones':   { revenue: 350, trend: [5.2, 4.8, 5.5, 4.1, 4.9] },
  'Audio':    { revenue: 180, trend: [2.0, 2.6, 3.3, 3.0, 3.8] },
  'Wearables':{ revenue: 140, trend: [1.2, 1.9, 2.8, 3.6, 4.4] },
  'Accessories': { revenue: 90, trend: [4.0, 3.7, 4.2, 3.9, 4.5] },
};
const labels = Object.keys(DATA);
const PALETTE = ['#60a5fa','#f472b6','#34d399','#fbbf24','#a78bfa'];
Chart.defaults.color = '#9a9a9a';
Chart.defaults.borderColor = '#2a2a2a';

const make = id => document.getElementById(id).getContext('2d');
const subset = cats => ({
  labels: cats,
  revenues: cats.map(c => DATA[c].revenue),
  trends: cats.map(c => DATA[c].trend.reduce((a,b)=>a+b,0) / DATA[c].trend.length),
});
let cur = subset(labels);

const barChart = new Chart(make('bar'), {
  type: 'bar',
  data: { labels: cur.labels, datasets: [{ label: 'Revenue ($k)',
    data: cur.revenues, backgroundColor: PALETTE, borderRadius: 6 }] },
  options: { onClick: (e, els) => els.length && filter(labels[els[0].index]),
             plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}} }
});
const lineChart = new Chart(make('line'), {
  type: 'line',
  data: { labels: ['Q1','Q2','Q3','Q4','Q5'], datasets: cur.labels.map((c,i) => ({
    label: c, data: DATA[c].trend, borderColor: PALETTE[i], tension: .35, pointRadius: 3 })) },
  options: { plugins:{legend:{position:'bottom', labels:{boxWidth:10}}} }
});
const donutChart = new Chart(make('donut'), {
  type: 'doughnut',
  data: { labels: cur.labels, datasets: [{ data: cur.revenues, backgroundColor: PALETTE, borderWidth: 0 }] },
  options: { cutout: '58%', plugins:{legend:{position:'bottom', labels:{boxWidth:10}}} }
});

function filter(cat){
  document.getElementById('reset').classList.add('active');
  const s = subset([cat]);
  barChart.data.labels = [cat]; barChart.data.datasets[0].data = s.revenues; barChart.update();
  donutChart.data.labels = [cat]; donutChart.data.datasets[0].data = s.revenues; donutChart.update();
  lineChart.data.datasets = [lineChart.data.datasets[labels.indexOf(cat)]]; lineChart.update();
}
document.getElementById('reset').onclick = function(){
  this.classList.remove('active');
  const s = subset(labels);
  barChart.data.labels = labels; barChart.data.datasets[0].data = s.revenues; barChart.update();
  donutChart.data.labels = labels; donutChart.data.datasets[0].data = s.revenues; donutChart.update();
  lineChart.data.datasets = labels.map((c,i) => ({
    label: c, data: DATA[c].trend, borderColor: PALETTE[i], tension: .35, pointRadius: 3 }));
  lineChart.update();
};
</script>
</html>
