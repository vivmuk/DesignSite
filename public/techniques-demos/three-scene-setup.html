<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Three.js Scene Fundamentals</title><style>:root{color-scheme:dark}body{background:#0d0d0d;color:#e4e4e4;font:14px/1.5 system-ui,sans-serif;margin:0;min-height:100vh}

body{margin:0;overflow:hidden}
#ui{position:fixed;top:16px;left:16px;background:rgba(22,22,22,.85);border:1px solid #333;border-radius:10px;padding:14px;width:220px;font-size:13px}
#ui label{display:flex;justify-content:space-between;margin:8px 0;cursor:pointer}
#ui input{accent-color:#7ee787;width:110px}
#ui b{color:#7ee787}

</style></head><body>

<div id="ui"><h3 style="margin:0 0 4px">Scene lights</h3>
<label>ambient <input id=amb type=range min=0 max=2 step=.05 value=.4><b id=ambv>0.40</b></label>
<label>directional <input id=dir type=range min=0 max=3 step=.05 value=1.5><b id=dirv>1.50</b></label>
<label>rotation <input id=spd type=range min=0 max=2 step=.05 value=.5><b id=spdv>0.50</b></label>
</div>
<script type="module">

import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0d0d0d);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);
camera.position.set(0,1.6,5);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,.4));
const dir=new THREE.DirectionalLight(0xffffff,1.5);
dir.position.set(4,6,3);
scene.add(dir);
const knot=new THREE.Mesh(
  new THREE.TorusKnotGeometry(1,.34,220,36),
  new THREE.MeshStandardMaterial({color:0x8899aa,metalness:.6,roughness:.25})
);
scene.add(knot);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:0x151515,roughness:.9}));
floor.rotation.x=-Math.PI/2;floor.position.y=-1.6;scene.add(floor);
const bind=(id,v_id,fn)=>{const el=document.getElementById(id),v=document.getElementById(v_id);
  el.addEventListener('input',()=>{fn(+el.value);v.textContent=(+el.value).toFixed(2);});fn(+el.value);};
bind('amb','ambv',v=>scene.children.find(c=>c.isAmbientLight).intensity=v);
bind('dir','dirv',v=>dir.intensity=v);
const spd={v:.5};bind('spd','spdv',v=>spd.v=v);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
(function loop(t){requestAnimationFrame(loop);knot.rotation.x=t*.0005*spd.v;knot.rotation.y=t*.0008*spd.v;renderer.render(scene,camera);})(0);
</script></body></html>
