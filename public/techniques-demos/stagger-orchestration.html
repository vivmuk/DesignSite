<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staggered Orchestration</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0d0d0d; color:#e4e4e4; font-family:'Helvetica Neue', Arial, sans-serif; min-height:100vh; }

.wrap { max-width:900px; margin:0 auto; padding:6vh 5vw; }
h1 { font-size:1.6rem; margin-bottom:2rem; font-weight:700; }
.bento { display:grid; grid-template-columns:repeat(6, 1fr); grid-auto-rows:110px; gap:12px; margin-bottom:2rem; }
.tile { border-radius:12px; background:#1a1a20; border:1px solid #2a2a2a; display:flex; align-items:flex-end; padding:0.8rem; font-size:0.75rem; color:#888; opacity:0; }
.tile.t2 { grid-column:span 2; } .tile.t3 { grid-column:span 3; } .tile.w2 { grid-row:span 2; }
.sl { display:flex; align-items:center; gap:1rem; max-width:420px; font-size:0.85rem; color:#aaa; }
input[type=range] { flex:1; accent-color:#8ab4ff; }

</style>
</head>
<body>

<div class="wrap">
  <h1>Stagger Control</h1>
  <div class="bento" id="bento"></div>
  <label class="sl">Stagger <input type="range" id="st" min="0" max="150" value="40"> <span id="stv">40ms</span></label>
</div>

<script>

const tiles = ['t2','t3','w2','','','t3','','w2','t2','','','t2','t3','','w2','','t3',''];
const bento = document.getElementById('bento');
tiles.forEach(function(c, i) {
  bento.insertAdjacentHTML('beforeend', '<div class="tile ' + c + '">tile ' + (i + 1) + '</div>');
});
function cascade(stagger) {
  const nodes = document.querySelectorAll('.tile');
  nodes.forEach(function(n) {
    n.style.transition = 'none';
    n.style.opacity = 0;
    n.style.transform = 'translateY(30px) scale(0.96)';
  });
  requestAnimationFrame(function() {
    nodes.forEach(function(n, i) {
      const col = i % 6, row = Math.floor(i / 6);
      const d = (col + row) * stagger;
      n.style.transition = 'opacity 0.5s ease ' + d + 'ms, transform 0.6s cubic-bezier(0.22,1,0.36,1) ' + d + 'ms';
      n.style.opacity = 1;
      n.style.transform = '';
    });
  });
}
document.getElementById('st').addEventListener('input', function(e) {
  document.getElementById('stv').textContent = e.target.value + 'ms';
  cascade(+e.target.value);
});
cascade(40);

</script>
</body>
</html>
