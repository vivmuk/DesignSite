<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Card Tilt</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0d0d0d; color:#e4e4e4; font-family:'Helvetica Neue', Arial, sans-serif; min-height:100vh; }

body { perspective:900px; }
.stage { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2.5rem; }
.tilt-wrap { perspective:900px; }
.card { position:relative; width:300px; height:420px; border-radius:18px;
  background:linear-gradient(160deg, #1a2637, #101018 70%);
  border:1px solid #2e3e55; transform-style:preserve-3d; transition:transform 0.12s ease-out; will-change:transform; }
.glare { position:absolute; inset:0; border-radius:18px; pointer-events:none; z-index:5;
  background:radial-gradient(circle at var(--gx,50%) var(--gy,50%), rgba(255,255,255,0.25), transparent 55%); }
.l1, .l2, .l3 { position:absolute; transform-style:preserve-3d; }
.l1 { top:1.2rem; left:1.2rem; transform:translateZ(30px); }
.tag { font-size:0.7rem; letter-spacing:0.25em; color:#7ee8fa; }
.l2 { top:40%; left:1.4rem; transform:translateZ(55px); }
.l2 h2 { font-size:1.6rem; letter-spacing:0.08em; }
.l3 { bottom:1.4rem; left:1.4rem; right:1.4rem; transform:translateZ(40px); }
.l3 p { color:#8a94a6; font-size:0.82rem; line-height:1.6; }
.hint { color:#666; font-size:0.85rem; }

</style>
</head>
<body>

<div class="stage">
  <div class="tilt-wrap">
    <div class="card" id="card">
      <div class="glare" id="glare"></div>
      <div class="l1"><span class="tag">HOLO · 001</span></div>
      <div class="l2"><h2>GLACIER FOX</h2></div>
      <div class="l3"><p>Collectible · Layer 3 pops forward</p></div>
    </div>
  </div>
  <p class="hint">Move the cursor over the card — it tilts toward you with a glare highlight and layered depth.</p>
</div>

<script>

const card = document.getElementById('card'), glare = document.getElementById('glare');
const wrap = card.parentElement;
wrap.addEventListener('pointermove', function(e) {
  const r = card.getBoundingClientRect();
  const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
  const rx = (0.5 - py) * 18, ry = (px - 0.5) * 22;
  card.style.transform = 'rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg)';
  card.style.setProperty('--gx', (px * 100) + '%');
  card.style.setProperty('--gy', (py * 100) + '%');
});
wrap.addEventListener('pointerleave', function() {
  card.style.transform = 'rotateX(0deg) rotateY(0deg)';
});

</script>
</body>
</html>
