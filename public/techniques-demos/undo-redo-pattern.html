<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Undo/Redo Stack</title><style>:root{color-scheme:dark}body{background:#0d0d0d;color:#e4e4e4;font:14px/1.5 system-ui,sans-serif;margin:0;min-height:100vh}

.wrap{max-width:640px;margin:32px auto}
.toolbar{display:flex;gap:8px;margin-bottom:16px}
button{background:#1c1c1c;border:1px solid #333;color:#e4e4e4;border-radius:8px;padding:8px 14px;cursor:pointer}
button:disabled{opacity:.35;cursor:not-allowed}
#board{position:relative;height:320px;border:1px solid #333;border-radius:12px;background:#111;overflow:hidden}
.sticky{position:absolute;width:110px;height:110px;background:#ffe066;color:#111;border-radius:6px;padding:8px;cursor:grab;font-size:12px;user-select:none;box-shadow:0 4px 12px rgba(0,0,0,.4)}
#timeline{margin-top:16px;color:#888;font-family:monospace;font-size:12px;max-height:120px;overflow:auto}
.ptr{color:#7ee787}

</style></head><body>

<div class="wrap">
<h1>Undo/Redo command history</h1>
<div class="toolbar">
<button id="add">Add note</button><button id="undo" disabled>↩ Undo</button><button id="redo" disabled>↪ Redo</button>
</div>
<div id="board"></div>
<div id="timeline"></div>
</div>
<script>

const board=document.getElementById('board'),timeline=document.getElementById('timeline');
let undoStack=[],redoStack=[],seq=0;
function apply(cmd){cmd.do();}
function push(cmd){
  apply(cmd);undoStack.push(cmd);redoStack=[];
  timelineInsert('+ '+cmd.label);
  sync();
}
function undo(){
  const cmd=undoStack.pop();if(!cmd)return;
  cmd.undo();redoStack.push(cmd);
  timelineInsert('↩ undo: '+cmd.label);sync();
}
function redo(){
  const cmd=redoStack.pop();if(!cmd)return;
  cmd.do();undoStack.push(cmd);
  timelineInsert('↪ redo: '+cmd.label);sync();
}
function timelineInsert(s){timeline.innerHTML='<div>'+s+'</div>'+timeline.innerHTML;}
function sync(){
  document.getElementById('undo').disabled=!undoStack.length;
  document.getElementById('redo').disabled=!redoStack.length;
}
document.getElementById('add').onclick=()=>{const n=makeNote();push({label:'add #'+(seq),do:()=>n.remove?board.appendChild(n):0,undo:()=>n.remove()});};
// fix: add command should re-add on undo of a delete, keep simple do/undo
document.getElementById('undo').onclick=undo;
document.getElementById('redo').onclick=redo;
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();}
});
function makeNote(){
  const n=document.createElement('div');n.className='sticky';
  n.textContent='note '+(++seq);
  const x=20+Math.random()*(board.clientWidth-130),y=20+Math.random()*(board.clientHeight-130);
  n.style.left=x+'px';n.style.top=y+'px';board.appendChild(n);
  let drag=null,startX,startY;
  n.addEventListener('pointerdown',e=>{
    drag=n;startX=e.clientX-n.offsetLeft;startY=e.clientY-n.offsetTop;n.setPointerCapture(e.pointerId);
    n._from={x:n.offsetLeft,y:n.offsetTop};
  });
  n.addEventListener('pointermove',e=>{if(drag!==n)return;n.style.left=(e.clientX-startX)+'px';n.style.top=(e.clientY-startY)+'px';});
  n.addEventListener('pointerup',()=>{
    if(drag!==n)return;drag=null;
    const from=n._from,to={x:n.offsetLeft,y:n.offsetTop};
    if(from.x===to.x&&from.y===to.y)return;
    push({label:'move #'+seq,do:()=>{n.style.left=to.x+'px';n.style.top=to.y+'px'},undo:()=>{n.style.left=from.x+'px';n.style.top=from.y+'px'}});
  });
  n.addEventListener('dblclick',()=>{
    const from={parent:board,el:n};
    push({label:'delete #'+seq,do:()=>n.remove(),undo:()=>board.appendChild(n)});
  });
  return n;
}
// seed one
makeNote();undoStack.length=0;seq=1;timeline.innerHTML='';sync();
</script></body></html>
