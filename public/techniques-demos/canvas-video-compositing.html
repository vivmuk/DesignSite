<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Canvas Video Compositing</title>
<style>
  body { margin:0; background:#0d0d0d; color:#e4e4e4; font:15px/1.5 system-ui, sans-serif;
         display:flex; flex-direction:column; align-items:center; gap:16px; min-height:100vh; padding:30px; }
  h1 { font-size:1.1rem; font-weight:600; opacity:.8; margin:0; }
  canvas { width:min(720px, 92vw); border:1px solid #333; border-radius:12px; }
  .bar { display:flex; gap:10px; }
  button { background:#262626; color:#e4e4e4; border:1px solid #444; border-radius:8px; padding:8px 18px; font:inherit; cursor:pointer; }
  button.on { background:#7c6cff; border-color:#7c6cff; }
  p.note { opacity:.55; font-size:.85rem; max-width:560px; text-align:center; margin:0; }
</style>
</head>
<body>
<h1>Video frames → canvas → effects</h1>
<canvas id="out" width="720" height="405"></canvas>
<div class="bar">
  <button id="thermal">Toggle thermal filter</button>
  <button id="box" class="on">Tracker box</button>
</div>
<p class="note">A procedural animation stands in for a &lt;video&gt; element — every frame is drawn with drawImage(), then filtered pixel-by-pixel with getImageData(). Works identically on real video.</p>
<script>
const src = document.createElement('canvas'); src.width = 720; src.height = 405;
const sc = src.getContext('2d');
const out = document.getElementById('out'), oc = out.getContext('2d', { willReadFrequently: true });
let thermal = false, showBox = true, t = 0;

function drawScene() {
  // "video" content: moving orb over animated grid backdrop
  sc.fillStyle = '#0a0a12'; sc.fillRect(0, 0, 720, 405);
  sc.strokeStyle = 'rgba(120,120,180,.15)';
  for (let x = 0; x < 720; x += 40) { sc.beginPath(); sc.moveTo(x + (t * 20) % 40, 0); sc.lineTo(x, 405); sc.stroke(); }
  for (let y = 0; y < 405; y += 40) { sc.beginPath(); sc.moveTo(0, y); sc.lineTo(720, y); sc.stroke(); }
  const ox = 360 + Math.cos(t * .8) * 220, oy = 200 + Math.sin(t * 1.3) * 120;
  const g = sc.createRadialGradient(ox, oy, 5, ox, oy, 80);
  g.addColorStop(0, '#ffdd88'); g.addColorStop(1, 'rgba(255,80,40,0)');
  sc.fillStyle = g; sc.beginPath(); sc.arc(ox, oy, 80, 0, 7); sc.fill();
  return [ox, oy];
}
function thermalize() {
  const img = oc.getImageData(0, 0, out.width, out.height), d = img.data;
  // pixelate: sample every 8th pixel block
  for (let y = 0; y < out.height; y += 8) for (let x = 0; x < out.width; x += 8) {
    const i = (y * out.width + x) * 4, v = (d[i] + d[i+1] + d[i+2]) / 3;
    const r = Math.min(255, v * 2.2), g2 = v < 128 ? v * 1.6 : 90, b = 255 - v;
    for (let dy = 0; dy < 8; dy++) for (let dx = 0; dx < 8; dx++) {
      const j = ((y + dy) * out.width + (x + dx)) * 4;
      if (x + dx < out.width && y + dy < out.height) { d[j] = r; d[j+1] = g2; d[j+2] = b; }
    }
  }
  oc.putImageData(img, 0, 0);
}
function loop() {
  t += .016;
  const [ox, oy] = drawScene();
  oc.drawImage(src, 0, 0);                 // the core compositing call
  if (thermal) thermalize();
  if (showBox) {                           // drawn tracker overlay
    oc.strokeStyle = '#4ade80'; oc.lineWidth = 2;
    oc.strokeRect(ox - 90, oy - 90, 180, 180);
    oc.font = '14px monospace'; oc.fillStyle = '#4ade80';
    oc.fillText('target [' + (ox | 0) + ',' + (oy | 0) + ']', ox - 88, oy - 98);
    oc.fillText('● REC', 16, 26); oc.fillStyle = '#ef4444'; oc.fillRect(116, 16, 10, 10);
  }
  requestAnimationFrame(loop);
}
loop();
document.getElementById('thermal').onclick = e => { thermal = !thermal; e.target.classList.toggle('on', thermal); };
document.getElementById('box').onclick = e => { showBox = !showBox; e.target.classList.toggle('on', showBox); };
</script>
</body>
</html>
