<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Absolute Overlay Composition — inset()</title>
<style>
  body { margin:0; background:#0d0d0d; color:#e4e4e4; font:16px/1.5 system-ui, sans-serif;
         display:flex; flex-direction:column; align-items:center; gap:20px; min-height:100vh; padding:30px; }
  h1 { font-size:1.1rem; font-weight:600; opacity:.8; margin:0; }
  .photo { position:relative; width:min(640px, 90vw); aspect-ratio:16/10; border-radius:14px; overflow:hidden;
           background: linear-gradient(135deg, #24304a 0%, #4a2b4d 45%, #7a4a3a 80%, #c9906a 100%); box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .badge { position:absolute; inset: auto auto 6% 6%; /* bottom-left corner */ padding:10px 18px;
           background:rgba(13,13,13,.82); backdrop-filter:blur(6px); border:1px solid #555; border-radius:10px;
           cursor:grab; user-select:none; touch-action:none; font-size:.9rem; transition: box-shadow .2s; }
  .badge:active { cursor:grabbing; box-shadow:0 0 0 3px #7c6cff55; }
  .badge b { color:#a99cff; }
  .corner { position:absolute; width:26px; height:26px; border:2px dashed #ffffff33; pointer-events:none; }
  .tl { top:10px; left:10px; border-right:none; border-bottom:none; }
  .tr { top:10px; right:10px; border-left:none; border-bottom:none; }
  .bl { bottom:10px; left:10px; border-right:none; border-top:none; }
  .br { bottom:10px; right:10px; border-left:none; border-top:none; }
  #readout { font-family:monospace; opacity:.7; font-size:.85rem; }
  .tips { opacity:.55; font-size:.85rem; max-width:520px; text-align:center; margin:0; }
  .tips code { color:#a99cff; background:#1a1a1a; padding:2px 8px; border-radius:6px; font-size:.78rem; }
  .vignette { position:absolute; inset:0; background:radial-gradient(circle at 70% 20%, transparent 40%, rgba(0,0,0,.45) 100%); pointer-events:none; }
  .credit { position:absolute; top:5%; right:6%; font-family:monospace; font-size:.7rem; opacity:.6; }

  .photo::selection { background:transparent; }
  .badge { box-shadow:0 6px 18px rgba(0,0,0,.5); }
  h1 + .photo { margin-top:0; }
</style>
</head>
<body>
<h1>Drag the watermark badge — snapping corners</h1>
<div class="photo" id="photo">
  <div class="vignette"></div>
  <div class="credit">iso 200 · f/1.8 · 1/250</div>
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <div class="badge" id="badge"><b>◎ VIV</b> · shot on nothing</div>
</div>
<div id="readout">inset: auto auto 6% 6%</div>
<p class="tips">The badge is positioned with a single <code>inset</code> shorthand — two corners anchored, two <code>auto</code>. Snapping happens within 12% of any corner guide.</p>
<script>
const photo = document.getElementById('photo'), badge = document.getElementById('badge'), ro = document.getElementById('readout');
let dragging = false;
badge.addEventListener('pointerdown', e => { dragging = true; badge.setPointerCapture(e.pointerId); });
badge.addEventListener('pointerup', () => dragging = false);
badge.addEventListener('pointermove', e => {
  if (!dragging) return;
  const pr = photo.getBoundingClientRect(), br = badge.getBoundingClientRect();
  // compute inset distances from pointer-dragged position
  const leftPct = ((br.left + br.width / 2) - pr.left) / pr.width * 100;
  const topPct  = ((br.top + br.height / 2) - pr.top) / pr.height * 100;
  const snap = v => Math.abs(v - 10) < 12 ? true : Math.abs(v - 90) < 12; // near corners
  const L = leftPct < 50, T = topPct < 50;
  const li = L ? Math.max(2, leftPct - 7) : 'auto';
  const ri = L ? 'auto' : Math.max(2, 93 - leftPct - 7);
  const ti = T ? Math.max(2, topPct - 9) : 'auto';
  const bi = T ? 'auto' : Math.max(2, 91 - topPct - 9);
  badge.style.inset = `${ti} ${ri} ${bi} ${li}`;
  ro.textContent = `inset: ${ti} ${ri} ${bi} ${li}${(snap(leftPct) && snap(topPct)) ? '  ⌁ snapped' : ''}`;
});
</script>
</body>
</html>
