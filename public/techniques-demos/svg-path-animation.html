<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SVG Path Drawing</title><style>:root{color-scheme:dark}body{background:#0d0d0d;color:#e4e4e4;font:14px/1.5 system-ui,sans-serif;margin:0;min-height:100vh}

body{margin:0;font-family:system-ui,sans-serif;background:#0d0d0d;color:#e4e4e4;display:grid;place-items:center;min-height:100vh}
.wrap{text-align:center}
svg{width:min(640px,90vw);overflow:visible}
path{fill:none;stroke:#7ee787;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
#math{font:13px monospace;color:#888;margin-top:8px;min-height:20px}
#math b{color:#7ee787}
button{background:#1c1c1c;border:1px solid #333;color:#e4e4e4;border-radius:8px;padding:8px 18px;cursor:pointer;margin:6px}
label{font-size:12px;color:#888}
input{accent-color:#7ee787;vertical-align:middle}

</style></head><body>

<div class=wrap>
<h1 style="font-weight:300">self-drawing signature</h1>
<svg viewBox="0 0 600 220">
<path id=p1 d="M40,150 C60,60 110,40 120,90 C130,140 90,170 70,150 C110,120 180,80 210,95 C240,110 200,160 240,150 C280,140 300,60 330,70 C360,80 330,150 370,140 C410,130 430,70 460,80 C490,90 450,150 500,130 C540,115 560,100 575,105"/>
<path id=p2 d="M90,190 C200,170 420,175 560,185"/>
</svg>
<div id=math></div>
<button id=replay>↻ redraw</button>
<label>speed <input id=sp type=range min=.3 max=3 step=.1 value=1></label>
</div>
<script>

const paths=[...document.querySelectorAll('path')];
const math=document.getElementById('math');
let speed=1;
document.getElementById('sp').oninput=e=>speed=+e.target.value;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
// measure
const lens=paths.map(p=>p.getTotalLength());
paths.forEach((p,i)=>{
  p.style.strokeDasharray=lens[i];
});
function draw(){
  if(reduced){paths.forEach(p=>p.style.strokeDashoffset=0);
    math.innerHTML=`L = <b>${lens.map(l=>l.toFixed(1)).join(' + ')}px</b> · prefers-reduced-motion: shown final state`;return;}
  const t0=performance.now();
  paths.forEach((p,i)=>{p._start=i*500;});
  function tick(now){
    const el=(now-t0)*speed;
    let done=true;
    paths.forEach((p,i)=>{
      const local=Math.max(0,Math.min(1,(el-p._start)/(1400)));
      if(local<1)done=false;
      p.style.strokeDashoffset=lens[i]*(1-local);
    });
    math.innerHTML=`dasharray = L = <b>${lens[0].toFixed(1)}px</b> · dashoffset: <b>${(lens[0]*(1-Math.max(0,Math.min(1,(el)/1400)))).toFixed(1)} → 0</b>`;
    if(!done)requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
document.getElementById('replay').onclick=draw;
addEventListener('click',e=>{if(!e.target.closest('button,input'))draw();});
draw();
</script></body></html>
