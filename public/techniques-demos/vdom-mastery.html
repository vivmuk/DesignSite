<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Virtual DOM Diffing Visualizer</title>
<style>
body{margin:0;background:#0d0d0d;color:#e4e4e4;font:14px system-ui;padding:24px;font-family:ui-monospace,monospace}
h1{font-size:18px;font-family:system-ui} p{color:#888;font-family:system-ui;max-width:700px}
.controls{display:flex;gap:8px;margin:16px 0}
button{background:#242424;color:#e4e4e4;border:1px solid #3a3a3a;padding:8px 14px;border-radius:6px;cursor:pointer}
button:disabled{opacity:.4}
.cols{display:flex;gap:40px}
.tree{font-size:13px;line-height:1.9}
.tree div{padding:2px 8px;border-radius:4px}
.new{color:#9effa1;background:rgba(80,255,120,.08)} .upd{color:#ffd479;background:rgba(255,200,80,.08)}
.move{color:#6cf;background:rgba(80,160,255,.08)} .del{color:#f66;text-decoration:line-through;opacity:.6}
.legend span{margin-right:16px;font-size:12px}
#steps{margin-top:20px;color:#aaa;font-size:13px;min-height:40px}
ul{list-style:none;padding-left:20px;margin:0}
</style></head><body>
<h1>Virtual DOM reconciliation — keyed diff, step through</h1>
<p>Left: old tree. Right: new tree. Press "Next step" to walk the diff algorithm: nodes are matched by <b>key</b>, so moves are detected rather than destroyed+recreated.</p>
<div class="controls"><button id="next">Next step ▶</button><button id="auto">Auto-play</button><button id="reset">Reset / new tree</button></div>
<div class="cols"><div><div class="legend"><span class="del">removed</span><span class="upd">updated</span><span class="new">created</span><span class="move">moved</span></div>
<div id="old" class="tree"></div></div><div><div class="legend" style="visibility:hidden">.</div><div id="new" class="tree"></div></div></div>
<div id="steps"></div>
<script>
let oldTree, newTree, steps, si;
const K=(k,txt,kids=[])=>({k,txt,kids});
function gen(){
  const tags=['item','card','row','note'];
  const oldKids=[], newKids=[];
  for(let i=0;i<5;i++){ oldKids.push(K('k'+i, tags[i%4]+' #'+i)); }
  const perm=[2,0,4,1,3];
  perm.forEach((oi,i)=>{ const kid=K('k'+oi, tags[oi%4]+' #'+oi);
    if(i===1) kid.txt+=' (edited)'; newKids.push(kid); });
  newKids.push(K('k9','item NEW'));
  oldTree=K('root','<list>',oldKids); newTree=K('root','<list>',newKids);
  // build steps
  steps=[];
  const om=Object.fromEntries(oldTree.kids.map(c=>[c.k,c])), nm=Object.fromEntries(newTree.kids.map(c=>[c.k,c]));
  for(const c of newTree.kids){ if(!(c.k in om)) steps.push({type:'created',node:c}); }
  for(const c of oldTree.kids){ if(!(c.k in nm)) steps.push({type:'removed',node:c}); }
  for(const c of newTree.kids){ const o=om[c.k]; if(o && o.txt!==c.txt) steps.push({type:'updated',node:c,old:o}); }
  for(const c of newTree.kids){ const o=om[c.k]; if(o && c.txt===o.txt){
    const oi=oldTree.kids.indexOf(o), ni=newTree.kids.indexOf(c); if(oi!==ni) steps.push({type:'moved',node:c,from:oi,to:ni}); } }
  si=0; render(); document.getElementById('steps').textContent='';
}
function nodeHtml(n, cls){ return `<div class="${cls||''}">&lt;${n.k}&gt; ${n.txt}` + (n.kids.length?list(n.kids,cls):'') + '</div>'; }
function list(kids, cls){ return '<ul>'+kids.map(k=>nodeHtml(k,cls)).join('')+'</ul>'; }
function render(){
  document.getElementById('old').innerHTML = nodeHtml(oldTree);
  const done=new Set(); for(let i=0;i<si;i++) done.add(steps[i].node.k+steps[i].type);
  const cls=n=>{ for(const s of steps.slice(0,si)) if(s.node===n) return s.type; return ''; };
  const clone=JSON.parse(JSON.stringify(newTree));
  document.getElementById('new').innerHTML = nodeHtml(clone, n=>cls(n));
  document.getElementById('steps').textContent = steps.slice(0,si).map(s=>`${s.type.toUpperCase()}  key=${s.node.k}` + (s.type==='moved'?`  (${s.from}→${s.to})`:'')).join('\n');
}
document.getElementById('next').onclick=()=>{ if(si<steps.length){si++;render();} };
document.getElementById('auto').onclick=()=>{ const t=setInterval(()=>{ if(si>=steps.length){clearInterval(t);return;} si++;render(); },700); };
document.getElementById('reset').onclick=gen;
gen();
</script></body></html>
