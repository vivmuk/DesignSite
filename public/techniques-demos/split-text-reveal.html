<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split-text Line/Char Reveals</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0d0d0d; color:#e4e4e4; font-family:'Helvetica Neue', Arial, sans-serif; min-height:100vh; }

main { min-height:100vh; display:flex; flex-direction:column; justify-content:center; gap:1.5rem; padding:0 8vw; }
h1.reveal { font-size:clamp(2.5rem,8vw,7rem); font-weight:700; line-height:1.05; }
.sub { font-size:1.2rem; color:#999; max-width:40ch; }
button { margin-top:1rem; align-self:flex-start; background:none; color:#e4e4e4; border:1px solid #444; padding:0.7rem 1.4rem; font-size:0.85rem; letter-spacing:0.15em; text-transform:uppercase; cursor:pointer; }
button:hover { border-color:#e4e4e4; }
.line-mask { overflow:hidden; display:block; }
.char { display:inline-block; will-change:transform; }

</style>
</head>
<body>

<main>
  <h1 class="reveal">Design is thinking made visual</h1>
  <p class="reveal sub">Every character rises out of its own mask, one after another.</p>
  <button id="rerun">Replay reveal</button>
</main>
<script src="https://unpkg.com/split-type@0.3.4/umd/index.min.js"></script>

<script>

function reveal(el, delay) {
  const split = new SplitType(el, { types: 'lines,chars' });
  split.lines.forEach(function(line) {
    const mask = document.createElement('span');
    mask.className = 'line-mask';
    line.parentNode.insertBefore(mask, line);
    mask.appendChild(line);
  });
  split.chars.forEach(function(c) { c.style.transform = 'translateY(110%)'; });
  requestAnimationFrame(function() {
    split.chars.forEach(function(c, i) {
      c.style.transition = 'transform 0.9s cubic-bezier(0.22,1,0.36,1) ' + (delay + i * 0.02) + 's';
      c.style.transform = 'translateY(0)';
    });
  });
}
function run() {
  document.querySelectorAll('[data-reveal]').forEach(function(el, i) {
    reveal(el.textContent.trim() ? el : el, i * 0.15);
  });
}
const originals = new Map();
document.querySelectorAll('.reveal').forEach(function(el) { originals.set(el, el.innerHTML); });
function rerun() {
  document.querySelectorAll('.reveal').forEach(function(el) { el.innerHTML = originals.get(el); });
  document.querySelectorAll('.reveal').forEach(function(el, i) { reveal(el, i * 0.15); });
}
const io = new IntersectionObserver(function(entries) {
  entries.forEach(function(e) {
    if (e.isIntersecting) { rerun(); io.disconnect(); }
  });
}, { threshold: 0.4 });
io.observe(document.querySelector('h1.reveal'));
document.getElementById('rerun').addEventListener('click', rerun);

</script>
</body>
</html>
