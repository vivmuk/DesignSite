<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scroll-driven Animations (CSS)</title>
<style>
  body { background:#0d0d0d; color:#e4e4e4; font-family:system-ui,sans-serif; margin:0; }
  .progress { position:fixed; top:0; left:0; height:4px; width:100%; background:#23233a; z-index:10; }
  .bar-fill { position:fixed; top:0; left:0; height:4px; background:linear-gradient(90deg,#8b7cff,#7dd8a0); width:100%; transform-origin:left; z-index:11;
    animation: grow linear both; animation-timeline: scroll(root block); }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  header { position:fixed; top:0; left:0; right:0; padding:1rem 2rem; z-index:5; pointer-events:none; }
  h1 { margin:0; font-size:1.3rem; }
  section { height:100vh; display:grid; place-items:center; padding:0 2rem; box-sizing:border-box; }
  section h2 { font-size:clamp(2rem,6vw,4rem); margin:0; }
  .parallax { will-change:transform; animation: drift linear both; animation-timeline: view(); animation-range: entry 0% cover 50%; }
  @keyframes drift { from { transform: translateY(120px); opacity:0; } to { transform: translateY(-60px); opacity:1; } }
  .scene { width:140px; height:140px; perspective:600px; animation: spin linear both; animation-timeline: scroll(root block); }
  .cube { width:100%; height:100%; position:relative; transform-style:preserve-3d; }
  .face { position:absolute; inset:0; background:#8b7cff44; border:2px solid #8b7cff; display:grid; place-items:center; font-size:2rem; }
  .f1 { transform: translateZ(70px); } .f2 { transform: rotateY(90deg) translateZ(70px); }
  .f3 { transform: rotateY(180deg) translateZ(70px); } .f4 { transform: rotateY(-90deg) translateZ(70px); }
  .f5 { transform: rotateX(90deg) translateZ(70px); } .f6 { transform: rotateX(-90deg) translateZ(70px); }
  @keyframes spin { from { transform: rotateX(0) rotateY(0); } to { transform: rotateX(360deg) rotateY(720deg); } }
  .fallback { position:fixed; bottom:1rem; left:1rem; right:1rem; color:#e8c468; font-size:.85rem; display:none; }
</style>
</head>
<body>
<div class="progress"></div><div class="bar-fill"></div>
<header><h1>Scroll-driven CSS — scroll down</h1></header>
<section><h2 class="parallax">01 · Parallax headline</h2></section>
<section style="justify-items:start"><h2 class="parallax">02 · Drift &amp; fade</h2></section>
<section><div class="scene"><div class="cube">
  <div class="face f1">◆</div><div class="face f2">✦</div><div class="face f3">✧</div>
  <div class="face f4">★</div><div class="face f5">⬟</div><div class="face f6">●</div>
</div></div></section>
<section><h2 class="parallax">03 · The end</h2></section>
<div class="fallback" id="fb">Scroll-driven animations aren't supported here — content still renders, it just doesn't animate.</div>
<script>
  if (!CSS.supports('animation-timeline: view()')) document.getElementById('fb').style.display = 'block';
</script>
</body>
</html>
