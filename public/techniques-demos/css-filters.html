<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Filter Darkroom</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0d0d0d; color:#e4e4e4; font-family:'Helvetica Neue', Arial, sans-serif; min-height:100vh; }

.wrap { max-width:960px; margin:0 auto; padding:6vh 5vw; }
h1 { font-size:1.6rem; margin-bottom:1.5rem; font-weight:700; }
.bench { display:grid; grid-template-columns:1.4fr 1fr; gap:16px; }
.frame { position:relative; border-radius:14px; overflow:hidden; min-height:320px; }
img { width:100%; height:100%; object-fit:cover; display:block; transition:filter 0.15s; }
.frost { position:absolute; left:8%; right:8%; bottom:8%; background:rgba(255,255,255,0.12);
  backdrop-filter:blur(10px) saturate(1.4); -webkit-backdrop-filter:blur(10px) saturate(1.4);
  border:1px solid rgba(255,255,255,0.25); border-radius:10px; padding:0.9rem 1.1rem; }
.frost p { font-size:0.8rem; color:rgba(255,255,255,0.9); }
.panel { background:#161616; border:1px solid #2a2a2a; border-radius:14px; padding:1.4rem; display:flex; flex-direction:column; gap:0.9rem; }
label { display:flex; flex-direction:column; gap:0.3rem; font-size:0.8rem; color:#999; }
input[type=range] { accent-color:#8ab4ff; }
.presets { display:flex; gap:0.5rem; flex-wrap:wrap; margin-top:0.4rem; }
.presets button { flex:1; background:none; border:1px solid #3a3a3a; color:#ccc; padding:0.5rem; cursor:pointer; font-size:0.78rem; border-radius:6px; }
.presets button:hover { border-color:#8ab4ff; color:#8ab4ff; }
code { font-family:ui-monospace, monospace; font-size:0.75rem; color:#8ab4ff; word-break:break-all; border-top:1px solid #2a2a2a; padding-top:0.8rem; }

</style>
</head>
<body>

<div class="wrap">
  <h1>Filter Darkroom</h1>
  <div class="bench">
    <div class="frame"><img id="img" src="https://picsum.photos/id/1015/640/420" alt="landscape photo">
      <div class="frost"><p>Frosted glass card — backdrop-filter:blur(10px) saturate(1.4)</p></div>
    </div>
    <div class="panel">
      <label>Brightness <input type="range" id="fb" min="0.2" max="2" step="0.02" value="1"></label>
      <label>Contrast <input type="range" id="fc" min="0.2" max="2" step="0.02" value="1"></label>
      <label>Saturate <input type="range" id="fs" min="0" max="3" step="0.05" value="1"></label>
      <label>Hue-rotate <input type="range" id="fh" min="0" max="360" value="0"></label>
      <label>Blur <input type="range" id="fbl" min="0" max="10" step="0.1" value="0"></label>
      <div class="presets">
        <button data-p="grayscale(1) contrast(1.3) brightness(0.9)">Noir</button>
        <button data-p="saturate(0.4) brightness(1.15) blur(1px)">Dream</button>
        <button data-p="saturate(1.8) contrast(1.3)">Punch</button>
        <button data-p="none">Reset</button>
      </div>
      <code id="cssout">filter: none</code>
    </div>
  </div>
</div>

<script>

const parts = { brightness:1, contrast:1, saturate:1, hue:0, blur:0 };
function upd() {
  let f = [];
  if (parts.brightness !== 1) f.push('brightness(' + parts.brightness + ')');
  if (parts.contrast !== 1) f.push('contrast(' + parts.contrast + ')');
  if (parts.saturate !== 1) f.push('saturate(' + parts.saturate + ')');
  if (parts.hue) f.push('hue-rotate(' + parts.hue + 'deg)');
  if (parts.blur) f.push('blur(' + parts.blur + 'px)');
  const css = f.length ? f.join(' ') : 'none';
  img.style.filter = css;
  document.getElementById('cssout').textContent = 'filter: ' + css;
}
[['fb','brightness'],['fc','contrast'],['fs','saturate'],['fh','hue'],['fbl','blur']].forEach(function(pair) {
  document.getElementById(pair[0]).addEventListener('input', function(e) {
    parts[pair[1]] = +e.target.value;
    upd();
  });
});
document.querySelectorAll('.presets button').forEach(function(b) {
  b.addEventListener('click', function() {
    img.style.filter = b.dataset.p === 'none' ? 'none' : b.dataset.p;
    document.getElementById('cssout').textContent = 'filter: ' + b.dataset.p;
    ['fb','fc','fs','fh','fbl'].forEach(function(id) { document.getElementById(id).value = id === 'fb' ? 1 : 0; });
    parts.brightness = 1; parts.contrast = 1; parts.saturate = 1; parts.hue = 0; parts.blur = 0;
    if (b.dataset.p !== 'none') { document.getElementById('cssout').textContent = 'filter: ' + b.dataset.p + ' (preset)'; }
    else { document.getElementById('cssout').textContent = 'filter: none'; }
  });
});

</script>
</body>
</html>
