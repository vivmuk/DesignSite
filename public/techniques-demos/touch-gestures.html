<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Touch Gestures</title><style>:root{color-scheme:dark}body{background:#0d0d0d;color:#e4e4e4;font:14px/1.5 system-ui,sans-serif;margin:0;min-height:100vh}

body{display:grid;place-items:center;margin:0}
.wrap{text-align:center;width:100%}
#stage{position:relative;height:380px;width:min(420px,90vw);margin:12px auto;border:1px solid #333;border-radius:16px;overflow:hidden;touch-action:none;background:#111}
.card{position:absolute;inset:0;margin:auto;width:260px;height:340px;background:#1c1c1c;border:1px solid #444;border-radius:16px;display:grid;place-items:center;font-size:60px;will-change:transform}
#hud{font-family:monospace;font-size:12px;color:#7ee787;white-space:pre;min-height:54px}

</style></head><body>

<div class="wrap">
<h1>Swipe · Pinch · Flick</h1>
<div id="stage"><div class="card" style="z-index:3">🍎</div><div class="card" style="z-index:2">🍌</div><div class="card" style="z-index:1">🍇</div></div>
<div id="hud">try: drag horizontally to swipe, two fingers to pinch, fast release to flick</div>
</div>
<script>

const stage=document.getElementById('stage'),hud=document.getElementById('hud');
const cards=[...stage.querySelectorAll('.card')];
let top=0;
const state={active:null,x0:0,y0:0,scale:1,baseScale:1,vel:0,t0:0,dx:0};
function show(c,text){hud.textContent=text;}
stage.addEventListener('pointerdown',e=>{
  state.active=e.pointerId;state.x0=e.clientX;state.y0=e.clientY;state.t0=performance.now();state.dx=0;
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove',e=>{
  if(e.pointerId!==state.active)return;
  const dx=e.clientX-state.x0,dy=e.clientY-state.y0,dt=performance.now()-state.t0;
  state.dx=dx;state.vel=dx/dt; // px per ms
  const card=cards[top];
  card.style.transform=`translateX(${dx}px) rotate(${dx*0.05}deg)`;
  show(e.pointerId,`drag dx=${dx.toFixed(0)}px  velocity=${state.vel.toFixed(2)}px/ms  pinch=${state.scale.toFixed(2)}x`);
});
stage.addEventListener('pointerup',e=>{
  if(e.pointerId!==state.active)return;state.active=null;
  const card=cards[top];
  if(Math.abs(state.vel)>0.9&&Math.abs(state.dx)>60){ // flick
    card.style.transition='transform .3s,opacity .3s';
    card.style.transform=`translateX(${Math.sign(state.dx)*400}px) rotate(${Math.sign(state.dx)*30}deg)`;
    card.style.opacity=0;
    setTimeout(()=>{card.style.transition='none';card.style.transform='none';card.style.opacity=1;card.style.zIndex=0;cards.forEach(c=>c.style.zIndex=(+c.style.zIndex||0)+1);top=(top+1)%cards.length;},320);
    show('','flick! dismissed → next card');
  } else {
    card.style.transition='transform .25s';card.style.transform='none';
    setTimeout(()=>card.style.transition='',260);
  }
});
// pinch via two-pointer touch events
let pinchStart=0,base=1;
stage.addEventListener('touchstart',e=>{if(e.touches.length===2){pinchStart=dist(e);base=state.scale;}},{passive:true});
stage.addEventListener('touchmove',e=>{if(e.touches.length===2){state.scale=base*dist(e)/pinchStart;cards[top].style.transform=`scale(${state.scale})`;show('','pinch scale='+state.scale.toFixed(2));e.preventDefault();}},{passive:false});
function dist(e){const[a,b]=[e.touches[0],e.touches[1]];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}
</script></body></html>
