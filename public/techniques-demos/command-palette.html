<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Command Palette ⌘K</title><style>:root{color-scheme:dark}body{background:#0d0d0d;color:#e4e4e4;font:14px/1.5 system-ui,sans-serif;margin:0;min-height:100vh}

.wrap{max-width:600px;margin:60px auto;text-align:center}
.hint{color:#888}kbd{background:#1c1c1c;border:1px solid #333;border-radius:6px;padding:2px 8px;font-family:monospace}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:start center;padding-top:12vh}
#overlay.open{display:grid}
#palette{width:min(560px,92vw);background:#161616;border:1px solid #333;border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
input{width:100%;box-sizing:border-box;background:none;border:none;outline:none;color:#e4e4e4;padding:16px;font-size:16px;border-bottom:1px solid #262626}
ul{list-style:none;margin:0;padding:6px;max-height:320px;overflow:auto}
li{padding:10px 12px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between}
li.sel{background:#2a2a2a}li .g{color:#666;font-size:12px}

</style></head><body>

<div class="wrap"><h1>Command Palette</h1><p class="hint">Press <kbd>⌘K</kbd> / <kbd>Ctrl+K</kbd> or <button id="open">open palette</button></p></div>
<div id="overlay"><div id="palette" role="dialog" aria-label="Command palette">
<input id="q" placeholder="Type a command…" autofocus>
<ul id="list"></ul></div></div>
<script>

const actions=[
 {t:'Switch to dark theme',g:'Theme',fn:()=>document.body.style.background='#0d0d0d'},
 {t:'Switch to light theme',g:'Theme',fn:()=>document.body.style.background='#e9e9e9'},
 {t:'Random accent color',g:'Theme',fn:()=>document.body.style.color=`hsl(${Math.random()*360},70%,70%)`},
 {t:'Reset styling',g:'Theme',fn:()=>{document.body.style.background='#0d0d0d';document.body.style.color='#e4e4e4'}},
 {t:'Add a sticky note',g:'Create',fn:()=>addNote('New note '+Date.now()%1000)},
 {t:'Clear all notes',g:'Create',fn:()=>document.querySelectorAll('.note').forEach(n=>n.remove())},
];
let recents=[];
const overlay=document.getElementById('overlay'),q=document.getElementById('q'),list=document.getElementById('list');
let sel=0,filtered=actions;
function fuzzy(s,q){s=s.toLowerCase();q=q.toLowerCase();let i=0;for(const c of q){i=s.indexOf(c,i);if(i<0)return false;i++;}return true;}
function render(){
  const term=q.value;filtered=term?actions.filter(a=>fuzzy(a.t,term)):actions;
  list.innerHTML=filtered.map((a,i)=>`<li class="${i===sel?'sel':''}" data-i="${i}"><span>${a.t}</span><span class="g">${a.g}</span></li>`).join('')||'<li><span class="g">no matches</span></li>';
}
function open(){overlay.classList.add('open');q.value='';sel=0;render();q.focus();}
function close(){overlay.classList.remove('open');}
function run(a){recents.unshift(a.t);a.fn();close();}
document.getElementById('open').onclick=open;
overlay.addEventListener('click',e=>{if(e.target===overlay)close()});
q.addEventListener('input',()=>{sel=0;render()});
list.addEventListener('click',e=>{const li=e.target.closest('[data-i]');if(li)run(filtered[+li.dataset.i])});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();overlay.classList.contains('open')?close():open();}
  if(!overlay.classList.contains('open'))return;
  if(e.key==='Escape')close();
  if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(sel+1,filtered.length-1);render();}
  if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(sel-1,0);render();}
  if(e.key==='Enter'&&filtered[sel])run(filtered[sel]);
});
function addNote(t){const n=document.createElement('div');n.className='note';n.textContent=t;
 n.style.cssText='position:fixed;bottom:20px;right:20px;background:#7ee787;color:#000;padding:12px 16px;border-radius:8px;font-weight:600';
 document.body.appendChild(n);}
</script></body></html>
