<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Web MIDI &amp; Sensors</title>
<style>
  body { margin:0; background:#0d0d0d; color:#e4e4e4; font:15px/1.5 system-ui, sans-serif; padding:28px; }
  h1 { font-size:1.1rem; margin:0 0 4px; }
  .hint { opacity:.55; font-size:.9rem; margin:0 0 20px; }
  .keys { display:flex; max-width:760px; height:220px; border-radius:10px; overflow:hidden; border:1px solid #3a3a3a; }
  .key { flex:1; background:#e8e8e8; border-right:1px solid #999; position:relative; transition:background .08s, transform .06s; }
  .key:active, .key.lit { background:#7c6cff; transform:translateY(2px); }
  .key span { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); font-size:.7rem; color:#333; }
  .black { position:absolute; top:0; height:60%; width:7%; background:#111; z-index:2; border-radius:0 0 4px 4px;
           border:1px solid #000; }
  .black.lit { background:#7c6cff; }
  .log { font-family:monospace; font-size:.78rem; background:#141414; border:1px solid #2a2a2a; border-radius:10px;
         padding:12px 16px; max-width:760px; margin-top:16px; height:130px; overflow-y:auto; }
  .log div { color:#7ee0a0; }
  .bar { display:flex; gap:10px; margin:14px 0; }
  button { background:#262626; color:#e4e4e4; border:1px solid #444; border-radius:8px; padding:8px 16px; font:inherit; cursor:pointer; }
  button.on { background:#7c6cff; border-color:#7c6cff; }
  #stat { font-size:.85rem; opacity:.6; }
</style>
</head>
<body>
<h1>Web MIDI piano — hardware or mouse</h1>
<p class="hint">Connect a MIDI keyboard and press keys; lights fire in-browser. No MIDI device? Play with the mouse/keyboard.</p>
<div class="bar"><button id="midi">⎹ Request MIDI access</button><span id="stat">state: idle</span></div>
<div class="keys" id="keys"></div>
<div class="log" id="log"></div>
<script>
const NOTES = ['C4','D4','E4','F4','G4','A4','B4','C5'];
const FREQ = { C4:261.6, D4:293.7, E4:329.6, F4:349.2, G4:392, A4:440, B4:493.9, C5:523.3 };
const keysEl = document.getElementById('keys'), log = document.getElementById('log');
NOTES.forEach((n, i) => {
  const k = document.createElement('div'); k.className = 'key'; k.dataset.n = n;
  k.innerHTML = `<span>${n}</span>`; keysEl.appendChild(k);
  if ([0,1,3,5,6].includes(i)) {
    const b = document.createElement('div'); b.className = 'black'; b.dataset.n = n + '#';
    b.style.left = ((i + 1) * (100 / 8) - 3.5) + '%';
    keysEl.appendChild(b);
  }
});
function addLog(m) { log.innerHTML = `<div>${new Date().toLocaleTimeString()} ${m}</div>` + log.innerHTML; }
let actx;
function playNote(name, vel = .5, src = 'mouse') {
  const el = document.querySelector(`[data-n="${name}"]`);
  if (el) { el.classList.add('lit'); setTimeout(() => el.classList.remove('lit'), 220); }
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  const o = actx.createOscillator(), g = actx.createGain();
  o.frequency.value = FREQ[name] || 440; o.type = 'triangle';
  g.gain.setValueAtTime(vel * .3, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + .6);
  o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + .65);
  addLog(`noteOn  ${name}  vel=${(vel*127)|0}  src=${src}`);
}
keysEl.addEventListener('pointerdown', e => { const n = e.target.dataset?.n; if (n) playNote(n); });
addEventListener('keydown', e => {
  const map = 'asdfghjk';
  const i = map.indexOf(e.key.toLowerCase());
  if (i >= 0) playNote(NOTES[i], .6, 'key ' + e.key);
});
document.getElementById('midi').onclick = async e => {
  const st = document.getElementById('stat');
  if (!navigator.requestMIDIAccess) { st.textContent = 'state: Web MIDI unsupported in this browser'; return; }
  try {
    const access = await navigator.requestMIDIAccess();
    const inputs = [...access.inputs.values()];
    if (!inputs.length) { st.textContent = 'state: MIDI granted — no devices found (mouse fallback active)'; return; }
    st.textContent = 'state: ' + inputs.map(i => i.name).join(', ');
    inputs.forEach(inp => inp.onmidimessage = m => {
      const [st8, note, vel] = m.data;
      if (st8 === 0x90 && vel > 0) {
        const names = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
        const name = names[note % 12] + (Math.floor(note / 12) - 1);
        const kEl = document.querySelector(`[data-n="${name}"]`);
        if (kEl) { kEl.classList.add('lit'); setTimeout(() => kEl.classList.remove('lit'), 200); }
        playNote(name, vel / 127, 'MIDI ch' + ((m.data[0] & 15) + 1));
      }
    });
  } catch (err) { st.textContent = 'state: MIDI permission denied'; }
};
</script>
</body>
</html>
