<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pose Game — MediaPipe Pose</title>
<style>
  body{margin:0;background:#0d0d0d;color:#e4e4e4;font:15px/1.6 system-ui;padding:20px}
  h1{font-size:19px} .sub{color:#9a9a9a;font-size:13px}
  .stage{position:relative;width:480px;max-width:100%}
  video,canvas{width:480px;max-width:100%;border-radius:12px;background:#111;display:block}
  canvas{position:absolute;inset:0;pointer-events:none}
  #score{font:700 26px monospace;color:#fbbf24;position:absolute;top:10px;right:14px;text-shadow:0 2px 8px #000}
  button{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:8px 16px;font:inherit;cursor:pointer;margin:10px 0}
  #status{color:#9a9a9a;font-size:13px;min-height:40px}
  .err{color:#f0a0a0}
</style>
</head>
<body>
<h1>Keepy-uppy pose game</h1>
<p class="sub">Bounce the ball with your hands — wrist keypoints (15 &amp; 16) are the paddles. Skeleton overlay shows confidence-tracked joints.</p>
<button id="start">Enable camera &amp; start</button>
<div class="stage">
  <video id="vid" autoplay playsinline muted></video>
  <canvas id="overlay" width="480" height="360"></canvas>
  <div id="score">0</div>
</div>
<div id="status">Load the model after camera access.</div>
<script>
const vid = document.getElementById('vid'), cv = document.getElementById('overlay'), x = cv.getContext('2d');
const status = document.getElementById('status');
const ball = {x:240, y:80, vx:2.4, vy:0, r:16};
let score = 0;

document.getElementById('start').onclick = async () => {
  try{
    vid.srcObject = await navigator.mediaDevices.getUserMedia({video:{width:640}});
    if (!window.Pose){ status.innerHTML='<span class="err">MediaPipe Pose failed to load (CDN?)</span>'; return; }
    status.textContent = 'Loading pose model…';
    const pose = new window.Pose({locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`});
    pose.setOptions({modelComplexity:0, smoothLandmarks:true, minDetectionConfidence:.5});
    pose.onResults(onResults);
    await pose.initialize();
    status.textContent = 'Playing! Bounce the ball with your wrists.';
    const loop = async () => { await pose.send({image: vid}); requestAnimationFrame(loop); };
    loop();
  }catch(e){ status.innerHTML = '<span class="err">' + e.message + '</span>'; }
};

const BONES = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
function onResults(res){
  x.clearRect(0,0,480,360);
  // physics always runs, even without a face on camera
  ball.vy += 0.25; ball.x += ball.vx; ball.y += ball.vy;
  if (ball.x<ball.r||ball.x>480-ball.r) ball.vx*=-1;
  if (ball.y > 340){ ball.y=80; ball.vy=0; score=Math.max(0,score-1); document.getElementById('score').textContent=score; }
  if (res.poseLandmarks){
    const lm = res.poseLandmarks;
    x.strokeStyle = '#34d39999'; x.lineWidth = 2;
    BONES.forEach(([a,b])=>{ x.beginPath(); x.moveTo(lm[a].x*480,lm[a].y*360); x.lineTo(lm[b].x*480,lm[b].y*360); x.stroke(); });
    x.fillStyle = '#e4e4e4';
    [15,16,11,12,23,24].forEach(i => x.fillRect(lm[i].x*480-3, lm[i].y*360-3, 6, 6));
    // wrist paddles bounce the ball
    [15,16].forEach(i => {
      const wx = lm[i].x*480, wy = lm[i].y*360;
      const dx = ball.x-wx, dy = ball.y-wy, d = Math.hypot(dx,dy);
      if (d < ball.r+34 && ball.vy > -2){
        ball.vy = -Math.abs(ball.vy)*1.02 - 1;
        ball.vx += dx*0.08;
        score++; document.getElementById('score').textContent = score;
      }
    });
  }
  x.fillStyle = '#fbbf24'; x.beginPath(); x.arc(ball.x, ball.y, ball.r, 0, 7); x.fill();
  x.fillStyle = '#0d0d0d'; x.beginPath(); x.arc(ball.x, ball.y, ball.r*0.4, 0, 7); x.fill();
}
</script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
</html>
