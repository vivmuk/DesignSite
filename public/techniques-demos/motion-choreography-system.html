<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motion Choreography System</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0d0d0d; color:#e4e4e4; font-family:'Helvetica Neue', Arial, sans-serif; min-height:100vh; }

.wrap { max-width:760px; margin:0 auto; padding:6vh 5vw; }
h1 { font-size:1.6rem; margin-bottom:1.5rem; font-weight:700; }
.tokens { display:grid; grid-template-columns:repeat(3, 1fr); gap:1.2rem; margin-bottom:2rem; }
label { display:flex; flex-direction:column; gap:0.4rem; font-size:0.8rem; color:#999; }
input[type=range], select { accent-color:#8ab4ff; background:#0d0d0d; color:#e4e4e4; border:1px solid #333; padding:0.4rem; border-radius:6px; }
.rows { display:flex; flex-direction:column; gap:0.8rem; margin-bottom:1.5rem; }
.comp { background:#161616; border:1px solid #2a2a2a; border-radius:10px; padding:1rem 1.2rem; display:flex; align-items:center; gap:1rem; opacity:0; }
.comp .swatch { width:34px; height:34px; border-radius:8px; background:#2d4a8a; flex:none; }
.comp span { font-size:0.85rem; color:#bbb; }
button { background:none; border:1px solid #444; color:#e4e4e4; padding:0.7rem 1.6rem; cursor:pointer; font-size:0.85rem; }
button:hover { border-color:#e4e4e4; }

</style>
</head>
<body>

<div class="wrap">
  <h1>Motion Tokens</h1>
  <div class="tokens">
    <label>Duration <input type="range" id="tdur" min="100" max="1200" value="500"> <span id="dv">500ms</span></label>
    <label>Easing <select id="tease">
      <option value="cubic-bezier(0.22, 1, 0.36, 1)">standard out</option>
      <option value="cubic-bezier(0.4, 0, 0.2, 1)">standard</option>
      <option value="cubic-bezier(0.34, 1.56, 0.64, 1)">overshoot</option>
      <option value="linear">linear</option>
    </select></label>
    <label>Stagger <input type="range" id="tst" min="0" max="120" value="50"> <span id="sv">50ms</span></label>
  </div>
  <div class="rows" id="rows"></div>
  <button id="replay">Replay all components</button>
</div>

<script>

const rows = document.getElementById('rows');
for (let i = 0; i < 6; i++) {
  rows.insertAdjacentHTML('beforeend', '<div class="comp"><div class="swatch"></div><span>Component ' + (i + 1) + ' — re-timed by tokens</span></div>');
}
let DUR = 500, EASE = 'cubic-bezier(0.22, 1, 0.36, 1)', STAG = 50;
function applyTokens() {
  DUR = +document.getElementById('tdur').value;
  EASE = document.getElementById('tease').value;
  STAG = +document.getElementById('tst').value;
  document.getElementById('dv').textContent = DUR + 'ms';
  document.getElementById('sv').textContent = STAG + 'ms';
  replay();
}
function replay() {
  const comps = document.querySelectorAll('.comp');
  comps.forEach(function(c) {
    c.style.transition = 'none';
    c.style.opacity = 0;
    c.style.transform = 'translateX(-40px)';
  });
  requestAnimationFrame(function() {
    comps.forEach(function(c, i) {
      c.style.transition = 'opacity ' + DUR + 'ms ' + EASE + ' ' + (i * STAG) + 'ms, transform ' + DUR + 'ms ' + EASE + ' ' + (i * STAG) + 'ms';
      c.style.opacity = 1;
      c.style.transform = 'none';
    });
  });
}
['tdur', 'tst'].forEach(function(id) { document.getElementById(id).addEventListener('input', applyTokens); });
document.getElementById('tease').addEventListener('change', applyTokens);
document.getElementById('replay').addEventListener('click', replay);
replay();

</script>
</body>
</html>
