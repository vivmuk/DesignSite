<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flexbox Perfect Centering</title>
<style>
  body { background:#0d0d0d; color:#e4e4e4; font-family:system-ui,sans-serif; padding:2rem; max-width:700px; margin:auto; }
  h1 { font-size:1.5rem; } .sub { color:#777; margin-bottom:1.6rem; }
  .stage-wrap { position:relative; }
  .stage { min-height:320px; border:2px dashed #2a2a2a; border-radius:16px; display:flex; justify-content:center; align-items:center; background:#101014; }
  .badge { background:linear-gradient(135deg,#8b7cff,#4a3aff); color:#fff; padding:.9rem 1.6rem; border-radius:999px; font-weight:700; box-shadow:0 8px 30px #8b7cff44; text-align:center; transition:all .25s; }
  .badge small { display:block; font-weight:400; font-size:.72rem; opacity:.8; }
  .lines { position:absolute; inset:0; pointer-events:none; }
  .axis-h { position:absolute; left:0; right:0; top:50%; border-top:1px dashed #8b7cff88; }
  .axis-v { position:absolute; top:0; bottom:0; left:50%; border-left:1px dashed #7dd8a088; }
  .tag-h, .tag-v { position:absolute; font-size:.68rem; font-family:ui-monospace,monospace; padding:.15rem .5rem; border-radius:4px; }
  .tag-h { top:calc(50% - 1.4rem); left:.6rem; background:#8b7cff22; color:#8b7cff; }
  .tag-v { left:calc(50% + .4rem); top:.6rem; background:#7dd8a022; color:#7dd8a0; }
  .controls { display:flex; gap:.6rem; margin:1.2rem 0; flex-wrap:wrap; }
  .controls button { background:#1a1a1a; color:#e4e4e4; border:1px solid #333; border-radius:8px; padding:.45rem 1rem; cursor:pointer; font-size:.85rem; }
  .controls button:hover { border-color:#8b7cff; }
  .code { background:#141414; border:1px solid #262626; border-radius:10px; padding:1rem; font-family:ui-monospace,monospace; font-size:.82rem; color:#a8d4b0; line-height:1.8; }
  .code b { color:#8b7cff; }
</style>
</head>
<body>
<h1>Flexbox Perfect Centering</h1>
<p class="sub">Three lines, bulletproof centering — surviving any content change, with both axes highlighted.</p>
<div class="controls">
  <button onclick="grow()">More content</button>
  <button onclick="shrink()">Less content</button>
</div>
<div class="stage-wrap">
  <div class="stage">
    <div class="badge" id="badge">Centered ✓<small>regardless of my size</small></div>
    <div class="lines">
      <div class="axis-h"></div><div class="axis-v"></div>
      <span class="tag-h">justify-content: center</span>
      <span class="tag-v">align-items: center</span>
    </div>
  </div>
</div>
<div class="code" style="margin-top:1.4rem">
  display: <b>flex</b>;<br>
  justify-content: <b>center</b>;  <span style="color:#555">/* main axis */</span><br>
  align-items: <b>center</b>;      <span style="color:#555">/* cross axis */</span>
</div>
<script>
  const badge = document.getElementById('badge');
  const lines = ['regardless of my size', 'now with two lines of copy', 'three lines — still dead center', 'four lines and wider — the flexbox adapts'];
  let n = 0;
  function grow() { n = Math.min(n + 1, 3); badge.innerHTML = 'Centered ✓<small>' + lines[n] + '</small>'; }
  function shrink() { n = Math.max(n - 1, 0); badge.innerHTML = 'Centered ✓<small>' + lines[n] + '</small>'; }
</script>
</body>
</html>
