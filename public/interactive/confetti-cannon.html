<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A success state that actually celebrates.">
<title>Confetti Cannon — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#120a1c}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#eef1f7;overflow:hidden;-webkit-font-smoothing:antialiased}
canvas{display:block;position:fixed;inset:0;touch-action:none;cursor:crosshair}
.hud{position:fixed;top:16px;left:16px;z-index:5;background:#0b0d13cc;border:1px solid #ffffff1c;border-radius:10px;padding:10px 13px;font:500 10px/1.6 ui-monospace,monospace;letter-spacing:.1em;color:#939caf;backdrop-filter:blur(8px)}
.hud b{color:#ff5c8a;font-weight:600}
.hud .t{display:block;color:#eef1f7;font-size:11px;letter-spacing:.16em;margin-bottom:3px}
.hint{position:fixed;left:16px;bottom:14px;margin:0;z-index:5;font:500 10px/1 ui-monospace,monospace;letter-spacing:.14em;color:#7e8799;text-transform:uppercase}
.pause{position:fixed;right:16px;bottom:12px;z-index:5;background:#0b0d13cc;border:1px solid #ffffff22;color:#cfd6e2;border-radius:999px;padding:8px 12px;font:600 10px/1 ui-monospace,monospace;letter-spacing:.1em;cursor:pointer}
.pause:focus-visible{outline:2px solid #ff5c8a;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.hint{display:none}}
</style>
</head>
<body>
<canvas id="cv" aria-label="Confetti Cannon interactive canvas"></canvas>
<div class="hud"><span class="t">PLAY / REVEAL · Confetti Cannon</span><b id="stat">ready</b> · <b id="fps">60</b> fps</div>
<p class="hint">MOVE · DRAG · SPACE TO PAUSE</p>
<button class="pause" id="pause" type="button" aria-pressed="false">PAUSE</button>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const P=["#120a1c", "#3a1250", "#a12bb8", "#ff5c8a", "#ffd1e6"],TAU=Math.PI*2;
let W=0,H=0,DPR=Math.min(devicePixelRatio||1,2);
function fit(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);
const mx={x:-1e4,y:-1e4,down:false};
addEventListener('pointermove',e=>{mx.x=e.clientX;mx.y=e.clientY;},{passive:true});
addEventListener('pointerdown',e=>{mx.down=true;mx.x=e.clientX;mx.y=e.clientY;});
addEventListener('pointerup',()=>mx.down=false);
addEventListener('pointerleave',()=>{mx.x=-1e4;mx.y=-1e4;});
const rnd=(a=1,b=0)=>b+Math.random()*(a-b);
const statEl=document.getElementById('stat'),fpsEl=document.getElementById('fps');
let statText='ready';const stat=v=>{statText=v};
let t=0,paused=false,last=performance.now(),acc=0,frames=0;
const pauseBtn=document.getElementById('pause');
function setPaused(v){paused=v;pauseBtn.textContent=paused?'PLAY':'PAUSE';pauseBtn.setAttribute('aria-pressed',String(paused));}
pauseBtn.addEventListener('click',()=>setPaused(!paused));
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();setPaused(!paused);}});

const V='confetti';
const ps=[];const MAX=1400;let pmx=mx.x,pmy=mx.y,hist=[],amb=0,idle=0;
function spawn(x,y,n,opts){for(let i=0;i<n;i++){if(ps.length>=MAX)ps.shift();const a=opts?.a??rnd(TAU),sp=opts?.sp??rnd(260,20);
 ps.push({x,y,vx:Math.cos(a)*sp+(opts?.vx||0),vy:Math.sin(a)*sp+(opts?.vy||0),life:opts?.life??1,r:opts?.r??rnd(3.4,.8),rot:rnd(TAU),vr:rnd(8,-8),c:P[1+Math.floor(Math.random()*(P.length-2))],rect:opts?.rect});}}
function frame(dt){ctx.fillStyle='rgba(6,6,10,'+(V==='sparkler'?.22:.16)+')';ctx.fillRect(0,0,W,H);
 if(V==='comet'){const ix=mx.x>0?mx.x:W/2+Math.cos(t*.8)*W*.24,iy=mx.y>0?mx.y:H/2+Math.sin(t*1.1)*H*.2;
  hist.push({x:ix,y:iy});if(hist.length>22)hist.shift();
  const p=hist[Math.floor(Math.random()*hist.length)];if(isFinite(p.x))spawn(p.x+rnd(6,-6),p.y+rnd(6,-6),5,{sp:rnd(60,6),life:rnd(1.4,.7),r:rnd(4.6,2)});}
 else if(V==='confetti'){amb+=dt;const rate=mx.down?.12:.3;
  if(Math.floor(t*2)!==Math.floor((t-dt)*2)){for(let i=0;i<18;i++)spawn(W/2+Math.cos(t*3)*30,H-14,1,{sp:rnd(420,180),a:rnd(-Math.PI*.82,-Math.PI*.18),vy:-80,rect:true,r:rnd(10,5),life:rnd(2.4,1.4)});}
  while(amb>rate){amb-=rate;for(let i=0;i<9;i++)spawn(rnd(W),-10,1,{sp:rnd(90,20),a:rnd(Math.PI*.15,Math.PI*.85),vy:rnd(10,-40),rect:true,r:rnd(11,6),life:rnd(2.6,1.6)});}
  if(mx.x>0)spawn(mx.x,mx.y,mx.down?8:3,{sp:rnd(360,140),a:rnd(-Math.PI*.9,-Math.PI*.1),vy:-140,rect:true,r:rnd(11,6),life:rnd(2.2,1.2)});}
 else if(V==='sparkler'){idle+=dt;const spd=Math.hypot(mx.x-pmx,mx.y-pmy)/Math.max(dt,.001);const n=Math.min(6,Math.floor(spd/90));
  if(mx.x>0)spawn(mx.x,mx.y,n,{sp:rnd(60,10),life:rnd(.8,.3),r:rnd(2.4,.8)});
  else if(idle>.02){idle=0;const ix=W/2+Math.cos(t*.9)*W*.22,iy=H/2+Math.sin(t*1.3)*H*.18;spawn(ix,iy,6,{sp:rnd(80,12),life:rnd(1.3,.5),r:rnd(4.6,2)});}}
 else{if(mx.x>0)spawn(mx.x,mx.y,mx.down?7:2,{sp:rnd(260,20),a:rnd(TAU),vy:-60,life:1});if(Math.random()<.5)spawn(W/2,H+10,1,{sp:rnd(60,-60),vy:-rnd(160,80)});}
 pmx=mx.x;pmy=mx.y;
 for(let i=ps.length-1;i>=0;i--){const p=ps[i];p.vy+=240*dt;p.vx*=1-dt*.7;p.vy*=1-dt*(p.rect?.8:.25);p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt*(p.rect?.35:.5);p.rot+=p.vr*dt;
  if(p.life<=0||p.y>H+60){ps.splice(i,1);continue;}
  ctx.globalAlpha=Math.max(0,Math.min(1,p.life));ctx.fillStyle=p.c;
  if(p.rect){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillRect(-p.r,-p.r*.55,p.r*2,p.r*1.1);ctx.restore();}
  else{ctx.beginPath();ctx.arc(p.x,p.y,p.r*Math.max(.2,p.life),0,TAU);ctx.fill();}}
 ctx.globalAlpha=1;stat(ps.length+(V==='comet'?' comet tails':V==='confetti'?' confetti':V==='sparkler'?' sparks':' particles'));}

function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(!paused){t+=dt;frame(dt);}
 acc+=dt;frames++;if(acc>.5){statEl.textContent=statText;fpsEl.textContent=Math.round(frames/acc);frames=0;acc=0;}
 requestAnimationFrame(loop);}
if(matchMedia('(prefers-reduced-motion: reduce)').matches){frame(0);statEl.textContent=statText;setPaused(true);}
requestAnimationFrame(loop);
</script>
</body>
</html>
