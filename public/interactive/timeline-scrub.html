<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Drag one handle through a year of events.">
<title>Timeline Scrub — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#07080c}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#eef1f7;overflow:hidden;-webkit-font-smoothing:antialiased}
canvas{display:block;position:fixed;inset:0;touch-action:none}
#cv{cursor:crosshair}
.hud{position:fixed;top:16px;left:16px;z-index:20;background:#0b0d13cc;border:1px solid #ffffff1c;border-radius:10px;padding:10px 13px;font:500 10px/1.6 ui-monospace,monospace;letter-spacing:.1em;color:#939caf;backdrop-filter:blur(8px)}
.hud b{color:#8fd8ff;font-weight:600}
.hud .t{display:block;color:#eef1f7;font-size:11px;letter-spacing:.16em;margin-bottom:3px}
.hint{position:fixed;left:16px;bottom:14px;margin:0;z-index:20;font:500 10px/1 ui-monospace,monospace;letter-spacing:.14em;color:#7e8799;text-transform:uppercase}
.pause{position:fixed;right:16px;bottom:12px;z-index:20;background:#0b0d13cc;border:1px solid #ffffff22;color:#cfd6e2;border-radius:999px;padding:8px 12px;font:600 10px/1 ui-monospace,monospace;letter-spacing:.1em;cursor:pointer}
.pause:focus-visible{outline:2px solid #8fd8ff;outline-offset:2px}

body{overflow:hidden;background:#07080c}
#cv{z-index:0;opacity:.9}
#ui{position:relative;z-index:3;min-height:100vh;display:grid;place-items:center;padding:34px}
.k{font:600 10px/1.4 ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:#8fd8ff}
h2{font-size:clamp(28px,5vw,64px);line-height:.95;letter-spacing:-.04em;margin:10px 0 0;font-weight:650}
p.sub{max-width:44ch;color:#98a1b3;font-size:14px;line-height:1.6}
.card{background:#0d1018;border:1px solid #ffffff1a;border-radius:18px;box-shadow:0 30px 80px #0008}
button{font:inherit;color:inherit}
@media (max-height:520px){#ui{padding:10px}h2{font-size:clamp(22px,7vh,36px)}p.sub{font-size:10.5px;max-width:38ch}.k{font-size:8px}}

body{overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
body::-webkit-scrollbar{display:none}
#cv{position:fixed;inset:0;z-index:0;opacity:.9}
#ui{position:relative;z-index:3;display:block;min-height:100vh;padding:0}
.k{font:600 10px/1.4 ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:#8fd8ff}
h2{font-size:clamp(30px,7vw,78px);line-height:.92;letter-spacing:-.045em;margin:10px 0;font-weight:650}
h2 em{font-style:normal;color:#8fd8ff}
p{color:#98a1b3;font-size:13px;line-height:1.6}

.tl-stage{width:min(880px,94vw);text-align:center}
.tl-year{display:flex;align-items:baseline;justify-content:center;gap:14px;margin:14px 0 18px}.tl-year b{font-size:40px;letter-spacing:-.04em}.tl-year span{font:600 11px/1 ui-monospace,monospace;color:#8fd8ff;letter-spacing:.16em}
.tl-track{position:relative;padding:22px 0 8px}
input[type=range]{width:100%;accent-color:#8fd8ff;height:2px}
.tl-events{display:flex;justify-content:space-between;margin-top:10px}
.tl-events i{width:7px;height:7px;border-radius:50%;background:#3a4152;transition:background .2s,transform .2s}.tl-events i.on{background:#8fd8ff;transform:scale(1.6)}
.tl-card{margin:24px auto 0;max-width:440px;background:#0d1018;border:1px solid #ffffff18;border-radius:14px;padding:18px;text-align:left}
.tl-card b{font-size:16px}.tl-card p{font-size:12px;margin:6px 0 0}
</style></head>
<body data-canvas="0" data-scroll="0">
<canvas id="cv" aria-hidden="true"></canvas>
<div id="ui">
<div class="tl-stage"><p class="k">TYPE / TIMELINE SCRUB</p><h2>A year,<br><em>on a handle.</em></h2>
<div class="tl-year"><b id="yr">2026</b><span id="mo">JAN</span></div>
<div class="tl-track"><input type="range" min="0" max="11" value="0" id="range"><div class="tl-events" id="events"></div></div>
<div class="tl-card" id="card"><b id="ct">Winter launch</b><p id="cd">The year starts with one clear release.</p></div></div>
</div>
<div class="hud"><span class="t">TYPE / IMAGE · Timeline Scrub</span><b id="stat">ready</b></div>
<p class="hint">MOVE · DRAG · SPACE TO PAUSE</p>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=Math.min(devicePixelRatio||1,2);
function fit(){W=innerWidth;H=innerHeight;cv.width=Math.floor(W*DPR);cv.height=Math.floor(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);
const mx={x:W/2,y:H/2,down:false};
addEventListener('pointermove',e=>{mx.x=e.clientX;mx.y=e.clientY;},{passive:true});
addEventListener('pointerdown',e=>{mx.down=true;});
addEventListener('pointerup',()=>{mx.down=false;});
const rnd=(a=1,b=0)=>b+Math.random()*(a-b);
const statEl=document.getElementById('stat');
let statText='scrub the year';const stat=v=>{statText=v};
const ui=document.getElementById('ui');

const R=document.getElementById('range'),EV=[['Winter launch','The year starts with one clear release.'],['Spring system','Tokens and components settle into a language.'],['Summer film','Motion becomes the brand.'],['Autumn index','The work gets a catalogue.'],['Winter edition','A second release, smaller and sharper.'],['Quiet month','Nothing ships. Everything is reviewed.'],['Spring again','The loop restarts with better tools.'],['Summer study','Research becomes a product surface.'],['Autumn type','A custom face, drawn in-house.'],['Winter lights','The dark theme gets its own palette.'],['Year end','One page that holds all of it.'],['Next','A blank file with a name.']];
const dots=document.getElementById('events');EV.forEach(()=>{const i=document.createElement('i');dots.appendChild(i);});
addEventListener('input',()=>{});
R.addEventListener('input',()=>{const v=+R.value;document.getElementById('yr').textContent=2026;document.getElementById('mo').textContent=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][v];document.getElementById('ct').textContent=EV[v][0];document.getElementById('cd').textContent=EV[v][1];[...dots.children].forEach((d,i)=>d.classList.toggle('on',i<=v));});
setInterval(()=>{R.value=(+R.value+1)%12;R.dispatchEvent(new Event('input'));},1400);R.dispatchEvent(new Event('input'));
function frame(dt){ctx.fillStyle='#06070b';ctx.fillRect(0,0,W,H);stat('month '+R.value);}

function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!window.__paused){t+=dt;frame(dt);}
 statEl.textContent=statText;requestAnimationFrame(loop);}
let t=0,last=performance.now();window.__paused=false;
frame(0);requestAnimationFrame(loop);
</script></body></html>
