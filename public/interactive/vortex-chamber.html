<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A flow field with you at the centre of the storm.">
<title>Vortex Chamber — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#04120f}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#eef1f7;overflow:hidden;-webkit-font-smoothing:antialiased}
canvas{display:block;position:fixed;inset:0;touch-action:none;cursor:crosshair}
.hud{position:fixed;top:16px;left:16px;z-index:5;background:#0b0d13cc;border:1px solid #ffffff1c;border-radius:10px;padding:10px 13px;font:500 10px/1.6 ui-monospace,monospace;letter-spacing:.1em;color:#939caf;backdrop-filter:blur(8px)}
.hud b{color:#4dffd2;font-weight:600}
.hud .t{display:block;color:#eef1f7;font-size:11px;letter-spacing:.16em;margin-bottom:3px}
.hint{position:fixed;left:16px;bottom:14px;margin:0;z-index:5;font:500 10px/1 ui-monospace,monospace;letter-spacing:.14em;color:#7e8799;text-transform:uppercase}
.pause{position:fixed;right:16px;bottom:12px;z-index:5;background:#0b0d13cc;border:1px solid #ffffff22;color:#cfd6e2;border-radius:999px;padding:8px 12px;font:600 10px/1 ui-monospace,monospace;letter-spacing:.1em;cursor:pointer}
.pause:focus-visible{outline:2px solid #4dffd2;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.hint{display:none}}
</style>
</head>
<body>
<canvas id="cv" aria-label="Vortex Chamber interactive canvas"></canvas>
<div class="hud"><span class="t">POINTER · Vortex Chamber</span><b id="stat">ready</b> · <b id="fps">60</b> fps</div>
<p class="hint">MOVE · DRAG · SPACE TO PAUSE</p>
<button class="pause" id="pause" type="button" aria-pressed="false">PAUSE</button>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const P=["#04120f", "#0b3b34", "#16a085", "#4dffd2", "#c8fff2"],TAU=Math.PI*2;
let W=0,H=0,DPR=Math.min(devicePixelRatio||1,2);
function fit(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);
const mx={x:-1e4,y:-1e4,down:false};
addEventListener('pointermove',e=>{mx.x=e.clientX;mx.y=e.clientY;},{passive:true});
addEventListener('pointerdown',e=>{mx.down=true;mx.x=e.clientX;mx.y=e.clientY;});
addEventListener('pointerup',()=>mx.down=false);
addEventListener('pointerleave',()=>{mx.x=-1e4;mx.y=-1e4;});
const rnd=(a=1,b=0)=>b+Math.random()*(a-b);
const statEl=document.getElementById('stat'),fpsEl=document.getElementById('fps');
let statText='ready';const stat=v=>{statText=v};
let t=0,paused=false,last=performance.now(),acc=0,frames=0;
const pauseBtn=document.getElementById('pause');
function setPaused(v){paused=v;pauseBtn.textContent=paused?'PLAY':'PAUSE';pauseBtn.setAttribute('aria-pressed',String(paused));}
pauseBtn.addEventListener('click',()=>setPaused(!paused));
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();setPaused(!paused);}});

const V='vortex';
const ps=[];for(let i=0;i<950;i++)ps.push({x:rnd(W),y:rnd(H),px:0,py:0,h:Math.random(),age:Math.random()});
function frame(dt){
 if(V==='filings'){
  ctx.fillStyle='rgba(6,6,10,.3)';ctx.fillRect(0,0,W,H);ctx.lineWidth=1.2;
  for(const p of ps){const dx=mx.x-p.x,dy=mx.y-p.y,d=Math.hypot(dx,dy)||1,fall=Math.max(0,1-d/240);
   const base=Math.sin(p.x*.004+t*.4)*1.6+Math.cos(p.y*.003-t*.3)*1.2;
   const a=base*(1-fall)+Math.atan2(dy,dx)*fall, len=4+fall*16;
   ctx.strokeStyle=P[2+(fall>.5?1:0)];ctx.globalAlpha=.35+fall*.6;
   ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+Math.cos(a)*len,p.y+Math.sin(a)*len);ctx.stroke();
   p.x+=Math.cos(a)*16*dt;p.y+=Math.sin(a)*16*dt;
   if(p.x<0||p.x>W||p.y<0||p.y>H){p.x=rnd(W);p.y=rnd(H);}}
  ctx.globalAlpha=1;stat(ps.length+' filings');return;
 }
 const fade=V==='marbled'?.02:V==='ember'?.10:.09;
 ctx.fillStyle='rgba(6,6,10,'+fade+')';ctx.fillRect(0,0,W,H);
 for(const p of ps){let ang=Math.sin(p.x*.0035+t*.55)*1.9+Math.cos(p.y*.003-t*.4)*1.3;
  if(V==='vortex'){const dx=p.x-mx.x,dy=p.y-mx.y,d=Math.hypot(dx,dy)||1,fall=Math.max(0,1-d/340);ang=Math.atan2(dy,dx)+Math.PI/2*(.35+fall*1.8);}
  if(V==='ember'){ang=-Math.PI/2+Math.sin(p.x*.006+t*.8)*.95;p.age+=dt*.28;}
  const sp=V==='marbled'?26:V==='ember'?72:82;
  p.px=p.x;p.py=p.y;p.x+=Math.cos(ang)*sp*dt;p.y+=Math.sin(ang)*sp*dt;
  if(V!=='marbled'){const dx=p.x-mx.x,dy=p.y-mx.y,d=Math.hypot(dx,dy);if(d<190&&d>1){p.x+=dx/d*110*dt;p.y+=dy/d*110*dt;}}
  let out=p.x<-12||p.x>W+12||p.y<-12||p.y>H+12;
  if(V==='ember'&&p.y<-12){out=true;}
  if(out){p.x=rnd(W);p.y=V==='ember'?H+10:rnd(H);p.px=p.x;p.py=p.y;p.age=0;}
  const ci=V==='ember'?P[1+Math.min(P.length-2,Math.floor(p.age*(P.length-1)))]:P[1+Math.floor(p.h*(P.length-2))];
  ctx.strokeStyle=ci;ctx.globalAlpha=V==='marbled'?.7:.55;ctx.lineWidth=V==='marbled'?1.6:1;
  ctx.beginPath();ctx.moveTo(p.px,p.py);ctx.lineTo(p.x,p.y);ctx.stroke();}
 ctx.globalAlpha=1;stat(ps.length+' particles');}

function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(!paused){t+=dt;frame(dt);}
 acc+=dt;frames++;if(acc>.5){statEl.textContent=statText;fpsEl.textContent=Math.round(frames/acc);frames=0;acc=0;}
 requestAnimationFrame(loop);}
if(matchMedia('(prefers-reduced-motion: reduce)').matches){frame(0);statEl.textContent=statText;setPaused(true);}
requestAnimationFrame(loop);
</script>
</body>
</html>
