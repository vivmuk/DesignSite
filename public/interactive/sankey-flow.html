<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Where the budget actually goes, in curves.">
<title>Sankey Flow — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#07080c}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#eef1f7;overflow:hidden;-webkit-font-smoothing:antialiased}
canvas{display:block;position:fixed;inset:0;touch-action:none}
#cv{cursor:crosshair}
.hud{position:fixed;top:16px;left:16px;z-index:20;background:#0b0d13cc;border:1px solid #ffffff1c;border-radius:10px;padding:10px 13px;font:500 10px/1.6 ui-monospace,monospace;letter-spacing:.1em;color:#939caf;backdrop-filter:blur(8px)}
.hud b{color:#8fd8ff;font-weight:600}
.hud .t{display:block;color:#eef1f7;font-size:11px;letter-spacing:.16em;margin-bottom:3px}
.hint{position:fixed;left:16px;bottom:14px;margin:0;z-index:20;font:500 10px/1 ui-monospace,monospace;letter-spacing:.14em;color:#7e8799;text-transform:uppercase}
.pause{position:fixed;right:16px;bottom:12px;z-index:20;background:#0b0d13cc;border:1px solid #ffffff22;color:#cfd6e2;border-radius:999px;padding:8px 12px;font:600 10px/1 ui-monospace,monospace;letter-spacing:.1em;cursor:pointer}
.pause:focus-visible{outline:2px solid #8fd8ff;outline-offset:2px}

body{overflow:hidden;background:#07080c}
#cv{z-index:0;opacity:.9}
#ui{position:relative;z-index:3;min-height:100vh;display:grid;place-items:center;padding:34px}
.k{font:600 10px/1.4 ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:#8fd8ff}
h2{font-size:clamp(28px,5vw,64px);line-height:.95;letter-spacing:-.04em;margin:10px 0 0;font-weight:650}
p.sub{max-width:44ch;color:#98a1b3;font-size:14px;line-height:1.6}
.card{background:#0d1018;border:1px solid #ffffff1a;border-radius:18px;box-shadow:0 30px 80px #0008}
button{font:inherit;color:inherit}
@media (max-height:520px){#ui{padding:10px}h2{font-size:clamp(22px,7vh,36px)}p.sub{font-size:10.5px;max-width:38ch}.k{font-size:8px}}

body{overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
body::-webkit-scrollbar{display:none}
#cv{position:fixed;inset:0;z-index:0;opacity:.9}
#ui{position:relative;z-index:3;display:block;min-height:100vh;padding:0}
.k{font:600 10px/1.4 ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:#8fd8ff}
h2{font-size:clamp(30px,7vw,78px);line-height:.92;letter-spacing:-.045em;margin:10px 0;font-weight:650}
h2 em{font-style:normal;color:#8fd8ff}
p{color:#98a1b3;font-size:13px;line-height:1.6}

.sk-stage{width:min(960px,96vw);padding:22px 0}
.sk{width:100%;height:auto;overflow:visible}
.sk text{font:600 10px ui-monospace,monospace;fill:#8b95a8;letter-spacing:.06em}
.sk path{transition:opacity .2s}
.sk g.node{cursor:pointer}
</style></head>
<body data-canvas="0" data-scroll="0">
<canvas id="cv" aria-hidden="true"></canvas>
<div id="ui">
<div class="sk-stage"><p class="k">SPATIAL / SANKEY FLOW</p><h2>Follow the <em>volume.</em></h2>
<svg class="sk" viewBox="0 0 900 380" id="sk"></svg><p class="sub">Ribbon width is proportional to flow. Hover a node to isolate it.</p></div>
</div>
<div class="hud"><span class="t">3D / DEPTH · Sankey Flow</span><b id="stat">ready</b></div>
<p class="hint">MOVE · DRAG · SPACE TO PAUSE</p>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=Math.min(devicePixelRatio||1,2);
function fit(){W=innerWidth;H=innerHeight;cv.width=Math.floor(W*DPR);cv.height=Math.floor(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);
const mx={x:W/2,y:H/2,down:false};
addEventListener('pointermove',e=>{mx.x=e.clientX;mx.y=e.clientY;},{passive:true});
addEventListener('pointerdown',e=>{mx.down=true;});
addEventListener('pointerup',()=>{mx.down=false;});
const rnd=(a=1,b=0)=>b+Math.random()*(a-b);
const statEl=document.getElementById('stat');
let statText='3 stages';const stat=v=>{statText=v};
const ui=document.getElementById('ui');

const svg=document.getElementById('sk');const cols=[['Product','Growth','Ops'],['Build','Launch','Run'],['Team','Cloud','Tools']];
const flows=[[0,0,52],[0,1,28],[1,0,36],[1,1,34],[1,2,22],[2,1,18],[2,2,30],[2,3,12],[3,3,9]];const colX=[80,450,820],bw=18;
const nodes=[];let idx=0;cols.forEach((c,ci)=>c.forEach((label,ni)=>{const y=60+ni*140;nodes.push({x:colX[ci],y,label,ci,ni});}));
const ns='http://www.w3.org/2000/svg';const byStage=[[0,1,2],[3,4,5],[6,7,8]];
nodes.forEach((n,i)=>{const g=document.createElementNS(ns,'g');g.setAttribute('class','node');const r=document.createElementNS(ns,'rect');r.setAttribute('x',n.x-7);r.setAttribute('y',n.y-26);r.setAttribute('width',14);r.setAttribute('height',52);r.setAttribute('fill','#8fd8ff');r.setAttribute('opacity','.25');g.appendChild(r);const t=document.createElementNS(ns,'text');t.setAttribute('x',n.x+(n.ci===0?18:n.ci===2?-18:-50));t.setAttribute('y',n.y+4);t.setAttribute('text-anchor',n.ci===0?'start':n.ci===2?'end':'middle');t.textContent=n.label;g.appendChild(t);svg.appendChild(g);});
flows.forEach(([a,b,v],k)=>{const A=nodes[a],B=nodes[b];const x1=A.x+8,x2=B.x-8;const y1=A.y+(k%3-1)*14,y2=B.y+(k%3-1)*14;const p=document.createElementNS(ns,'path');const d='M'+x1+' '+y1+' C'+((x1+x2)/2)+' '+y1+' '+((x1+x2)/2)+' '+y2+' '+x2+' '+y2;const path=document.createElementNS(ns,'path');path.setAttribute('d',d);path.setAttribute('fill','none');path.setAttribute('stroke','url(#grad)');path.setAttribute('stroke-width',Math.max(4,v*.55));path.setAttribute('opacity','.32');path.setAttribute('stroke-linecap','round');svg.insertBefore(path,svg.firstChild);
 const dot=document.createElementNS(ns,'circle');dot.setAttribute('r','3.5');dot.setAttribute('fill','#dff4ff');const m=document.createElementNS(ns,'animateMotion');m.setAttribute('dur',(3+k*.3)+'s');m.setAttribute('repeatCount','indefinite');m.setAttribute('path',d);dot.appendChild(m);svg.appendChild(dot);});
const defs=document.createElementNS(ns,'defs');defs.innerHTML='<linearGradient id="grad" x1="0" x2="1"><stop offset="0" stop-color="#3b5bff"/><stop offset=".5" stop-color="#8fd8ff"/><stop offset="1" stop-color="#00d4aa"/></linearGradient>';svg.insertBefore(defs,svg.firstChild);
function frame(dt){ctx.fillStyle='#06070b';ctx.fillRect(0,0,W,H);stat('9 flows · 3 stages');}

function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!window.__paused){t+=dt;frame(dt);}
 statEl.textContent=statText;requestAnimationFrame(loop);}
let t=0,last=performance.now();window.__paused=false;
frame(0);requestAnimationFrame(loop);
</script></body></html>
